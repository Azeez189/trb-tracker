<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRB Task Tracker</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2330;--mute:#6b7280;--line:#e5e7eb;--brand:#c2410c;--brandbg:#fff1e8;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--warn:#b45309;--warnbg:#fef3c7}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.bar{max-width:1240px;margin:auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.logo{font-weight:800;font-size:16px;margin-right:8px}.logo span{color:var(--brand)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{border:0;background:none;padding:8px 12px;border-radius:8px;cursor:pointer;font:inherit;color:var(--mute)}
nav button.on{background:var(--brandbg);color:var(--brand);font-weight:600}
.spacer{flex:1}
#demo{background:var(--warnbg);color:var(--warn);text-align:center;padding:6px 12px;font-size:13px}
main{max-width:1240px;margin:auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.empty{text-align:center;color:var(--mute);padding:32px}
h2{font-size:17px;margin:0 0 12px}h2 small{font-weight:400;color:var(--mute);font-size:13px;margin-left:6px}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);margin:16px 0 6px}
.mute{color:var(--mute)}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
select,input,textarea{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
button{font:inherit;cursor:pointer;border:1px solid var(--brand);background:var(--brand);color:#fff;padding:7px 12px;border-radius:8px}
button.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
button.sm{padding:5px 10px;font-size:13px}
button.danger{color:var(--bad)}
.datenav{display:flex;gap:6px;align-items:center}
.datenav>button{background:#fff;color:var(--ink);border-color:var(--line);min-width:34px}
.wklbl{font-weight:600;min-width:110px;text-align:center}
.dayname{font-weight:600}
.prog{margin-top:14px}.progtxt{margin-bottom:6px}
.pbar{height:8px;background:#eef0f3;border-radius:99px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.tlist{display:flex;flex-direction:column;gap:4px}
.trow{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.trow:hover{background:#fafafa}
.trow input{width:18px;height:18px;accent-color:var(--ok);margin:0}
.trow .tt{flex:1}
.trow.ok{background:var(--okbg);border-color:#bbf7d0}.trow.ok .tt{text-decoration:line-through;color:var(--mute)}
.trow.late{border-color:#fecaca}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:#f1f3f5;color:var(--mute);white-space:nowrap}
.chip.bad{background:var(--badbg);color:var(--bad)}
.badge{font-size:12px;padding:2px 9px;border-radius:99px;vertical-align:middle}
.badge.bad{background:var(--badbg);color:var(--bad)}.badge.warn{background:var(--warnbg);color:var(--warn)}
.lnk{font-size:12px;color:var(--brand);text-decoration:none;white-space:nowrap}
.legend{display:flex;gap:14px;margin-top:12px;font-size:12px;color:var(--mute);flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-3px;margin-right:4px;border:1px solid var(--line)}
.scroll{overflow-x:auto;padding:0}
table.grid{border-collapse:collapse;width:100%;min-width:760px}
.grid th,.grid td{border-bottom:1px solid var(--line);padding:6px;text-align:center;font-size:13px}
.grid th{background:#fafafa;font-weight:600;position:sticky;top:0}
.grid th.today{background:var(--brandbg);color:var(--brand)}
.grid .tcol{text-align:left;position:sticky;left:0;background:#fff;min-width:260px;border-right:1px solid var(--line)}

.grid td.ok{background:var(--okbg);color:var(--ok)}
.grid td.miss{background:var(--badbg);color:var(--bad)}

.grid td.now{box-shadow:inset 2px 0 0 var(--brand),inset -2px 0 0 var(--brand)}
.grid td.na{background:repeating-linear-gradient(45deg,#fafafa,#fafafa 4px,#f1f2f4 4px,#f1f2f4 8px)}
.grid td.cnt{color:var(--mute);white-space:nowrap}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;margin-bottom:16px}

.mtop{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.pct{font-size:26px;font-weight:800}.pct.good{color:var(--ok)}.pct.mid{color:var(--warn)}.pct.low{color:var(--bad)}

.trend{font-size:12px;margin-bottom:10px}
table.tbl{width:100%;border-collapse:collapse}
.tbl th,.tbl td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:12px;color:var(--mute);font-weight:600}
.tbl td.r{text-align:right;white-space:nowrap}
.tbl tr.off td{opacity:.45}
.tbl.fix{table-layout:fixed}.tbl.fix td:nth-child(2){width:120px}.tbl.fix td:nth-child(3){width:150px}.tbl.fix td:nth-child(4){width:150px}
input.num{width:60px;padding:3px 6px}
.mgrid{display:grid;grid-template-columns:300px 1fr;gap:16px}

.form.sub{border:1px dashed var(--line);border-radius:10px;padding:14px;margin:12px 0;background:#fcfcfd}

.form label.inline{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.days label{flex-direction:row;align-items:center;gap:4px;border:1px solid var(--line);padding:5px 9px;border-radius:8px;color:var(--ink);cursor:pointer}

.login{max-width:360px;margin:60px auto}
code{background:#f1f3f5;padding:1px 5px;border-radius:4px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:#1d2330;color:#fff;padding:10px 16px;border-radius:10px;transition:.25s;z-index:50;opacity:0}
#toast.show{transform:translateX(-50%);opacity:1}#toast.bad{background:var(--bad)}
/* --- v2: akaun & pengguna --- */
.who-chip{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:6px}
.rb{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.03em}
.rb.owner{background:#1d2330;color:#fff}.rb.admin{background:#ede9fe;color:#6d28d9}.rb.editor{background:#dbeafe;color:#1d4ed8}.rb.staff{background:#f1f3f5;color:var(--mute)}
.rb.pending{background:var(--warnbg);color:var(--warn)}.rb.approved{background:var(--okbg);color:var(--ok)}.rb.rejected,.rb.suspended{background:var(--badbg);color:var(--bad)}

.notick{width:18px;text-align:center;font-size:14px}
.trow .ibtn{background:#fff;color:var(--ink);border-color:var(--line);padding:3px 9px;font-size:12px}
.ipanel{border:1px solid var(--line);border-top:0;margin:-4px 0 4px;padding:12px;border-radius:0 0 8px 8px;background:#fcfcfd;display:flex;flex-direction:column;gap:10px}
.ipanel label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute)}
.ipanel textarea{min-height:70px;resize:vertical;font:inherit}
.lrow{display:flex;gap:6px;margin-top:4px}.lrow input{flex:1}
.req{color:var(--bad);font-weight:600}
.meta{font-size:12px;color:var(--mute);line-height:1.6}
.hist{font-size:12px;border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px}
.grid td.part{background:var(--warnbg);color:var(--warn)}
.grid td.todo{color:#c4c9d2;font-weight:400}
fieldset.inputs{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:10px;margin:0}
fieldset.inputs legend{font-size:13px;font-weight:600;color:var(--ink);padding:0 4px}
.togrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.form label.tog{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-weight:500;min-width:230px}
.tog input{width:34px;height:18px;appearance:none;-webkit-appearance:none;background:#d1d5db;border-radius:99px;position:relative;cursor:pointer;transition:.15s;margin:0;flex:none;padding:0;border:0}
.tog input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.15s}
.tog input:checked{background:var(--ok)}.tog input:checked::after{left:18px}
.togrow select{padding:4px 8px;font-size:13px}
.togrow select:disabled,.form label.inline.dis{opacity:.4}
.rulehint{font-size:12px;background:#f1f5f9;border-radius:8px;padding:8px 10px;color:var(--ink)}
.rulehint.bad{background:var(--badbg);color:var(--bad)}
.uid{font-family:ui-monospace,monospace;font-size:12px;background:#f1f3f5;padding:6px 8px;border-radius:6px;word-break:break-all;user-select:all}
/* --- Modul Kehadiran Staff (v1) --- */
.att-widget{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0 2px;border-top:1px solid var(--line);margin-top:10px}
.att-label{font-size:13px;color:var(--mute);white-space:nowrap;flex-shrink:0}
.att-sel{font:inherit;padding:5px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.att-badge{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;padding:4px 11px;border-radius:99px}
.att-hadir{background:#dcfce7;color:#15803d}
.att-half{background:#dbeafe;color:#1d4ed8}
.att-cuti,.att-mc,.att-off{background:#f3f4f6;color:#6b7280}
.att-absent{background:#fee2e2;color:#b91c1c}
.att-pending{background:#fef3c7;color:#b45309}
.trow.att-exempt{opacity:.45;cursor:default}
.chip.att-na{background:#f1f3f5;color:#9ca3af}
.trow.locked{opacity:.75;cursor:default}
.chip.locked{background:#e5e7eb;color:#374151;font-size:11px}
.att-stats{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0;font-size:12px}
.att-stats span{display:inline-flex;align-items:center;gap:3px}
.att-week{margin-top:10px}
.att-week td{padding:5px 6px;font-size:13px}
.att-week tr.att-today td{background:var(--brandbg)}
.att-week tr.att-future td{opacity:.45}
.att-week tfoot td{font-weight:600;border-top:2px solid var(--line);border-bottom:none;padding-top:7px}
.att-week .att-sel{font-size:12px;padding:3px 6px}
</style>
</head>

<script type="module">
// =====================================================================
//  TETAPAN — isi dengan maklumat projek Supabase abang
//  (Supabase → Project Settings → API Keys). Kalau kosong = mod demo.
//  ⚠️ Guna "Publishable key" (sb_publishable_...) atau "anon public" key.
//  ❌ JANGAN letak "secret key" / "service_role" key di sini.
// =====================================================================
const SUPABASE_URL = "https://oyvsmprmustmsirfdsqu.supabase.co"
const SUPABASE_KEY = "sb_publishable_H0oVuPmAef-Zi0ZXfyonIw_2t1UmOxi"
const SITE_URL     = "http://localhost/";  // testing lokal — bukan production
// =====================================================================

const DEMO = !SUPABASE_URL || !SUPABASE_KEY;

// ---------- helper tarikh ----------
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const today = () => ymd(new Date());
const mondayOf = s => addDays(s, -((parse(s).getDay() + 6) % 7));
const dm = s => { const d = parse(s); return `${d.getDate()}/${d.getMonth() + 1}`; };
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const DN = ["Ahad", "Isnin", "Selasa", "Rabu", "Khamis", "Jumaat", "Sabtu"];
const DS = ["Ahd", "Isn", "Sel", "Rab", "Kha", "Jum", "Sab"];
const WEEK_ORDER = [1, 2, 3, 4, 5, 6, 0];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now());
const $ = s => document.querySelector(s);
const safeUrl = u => (/^https?:\/\//i.test(u) ? u : "https://" + u);

// ---------- data layer: Supabase ----------
function sbApi(sb) {
  const ok = ({ data, error }) => { if (error) throw error; return data; };
  const save = async (tb, o) => {
    const { id, created_at, archived_at, archived_by, ...r } = o;   // kolum arkib hanya diubah melalui fungsi server
    return ok(id ? await sb.from(tb).update(r).eq("id", id).select().single()
                 : await sb.from(tb).insert(r).select().single());
  };
  return {
    members: async () => ok(await sb.from("members").select("*").order("name")),
    tasks: async () => ok(await sb.from("tasks").select("*").order("sort").order("created_at")),
    checks: async (f, t) => {
      let out = [];
      for (let i = 0; ; i += 1000) {
        const d = ok(await sb.from("checks").select("task_id,date,done_by,done_at").gte("date", f).lte("date", t)
          .order("date").order("task_id").range(i, i + 999));
        out = out.concat(d);
        if (d.length < 1000) return out;
      }
    },
    saveMember: m => save("members", m),
    // "Padam": server padam kekal jika tiada rekod, jika ada rekod → ARKIB. Pulangkan "deleted" / "archived"
    deleteMember: async id => ok(await sb.rpc("delete_or_archive_member", { p_member: id })),
    restoreMember: async id => ok(await sb.rpc("restore_member", { p_member: id })),
    saveTask: t => save("tasks", t),
    insertTasks: async arr => ok(await sb.from("tasks").insert(arr).select()),
    deleteTask: async id => ok(await sb.rpc("delete_or_archive_task", { p_task: id })),
    restoreTask: async id => ok(await sb.rpc("restore_task", { p_task: id })),
    taskRecords: async tid => {
      const [c, s, h] = await Promise.all([
        sb.from("checks").select("date,done_by,done_at").eq("task_id", tid).order("date", { ascending: false }),
        sb.from("submissions").select("*").eq("task_id", tid).order("date", { ascending: false }),
        sb.from("submission_history").select("*").eq("task_id", tid).order("changed_at", { ascending: false })]);
      return { checks: ok(c), subs: ok(s), hist: ok(h) };
    },
    // --- v3: isian tugasan. "Selesai" (checks) dikira & ditulis oleh server ---
    subs: async (f, t) => {
      let out = [];
      for (let i = 0; ; i += 1000) {
        const d = ok(await sb.from("submissions").select("*").gte("date", f).lte("date", t).order("date").order("task_id").range(i, i + 999));
        out = out.concat(d);
        if (d.length < 1000) return out;
      }
    },
    // RPC atomik: hanya ruangan yang dihantar diubah; semakan kebenaran & konflik di server
    save: async (task_id, date, p) => ok(await sb.rpc("save_submission", {
      p_task_id: task_id, p_date: date, p_ticked: p.p_ticked ?? null,
      p_set_comment: !!p.p_set_comment, p_comment: p.p_comment ?? null, p_base_comment: p.p_base_comment ?? null,
      p_set_links: !!p.p_set_links, p_links: p.p_links ?? null, p_base_links: p.p_base_links ?? null })),
    history: async (tid, d) => ok(await sb.from("submission_history").select("*").eq("task_id", tid).eq("date", d).order("changed_at", { ascending: false })),
    // --- kehadiran staff ---
    attends: async (f, t) => {
      let out = [];
      for (let i = 0; ; i += 1000) {
        const d = ok(await sb.from("attendance").select("*").gte("date", f).lte("date", t).order("date").order("member_id").range(i, i + 999));
        out = out.concat(d);
        if (d.length < 1000) return out;
      }
    },
    saveAttend: async (member_id, date, status) => ok(await sb.from("attendance").upsert(
      { member_id, date, status, noted_by: ME?.id ?? null, noted_at: new Date().toISOString() },
      { onConflict: "member_id,date" }
    ).select().single()),
    // --- akaun & pengguna (semua disemak di server oleh RLS / fungsi SQL) ---
    myProfile: async uid => ok(await sb.from("profiles").select("*").eq("id", uid).maybeSingle()),
    people: async () => ok(await sb.rpc("people")),
    users: async () => ok(await sb.from("profiles").select("*").order("created_at", { ascending: false })),
    setStatus: async (id, s) => ok(await sb.rpc("set_user_status", { p_target: id, p_status: s })),
    setRole: async (id, r) => ok(await sb.rpc("set_user_role", { p_target: id, p_role: r })),
    linkMember: async (id, m) => ok(await sb.rpc("link_user_member", { p_target: id, p_member: m || null })),
    createMemberFor: async id => ok(await sb.rpc("create_member_for_user", { p_target: id })),
  };
}

// ---------- data layer: demo (dalam memori) ----------
function demoApi() {
  const st = seed();
  const upsert = (arr, o) => {
    if (o.id) { const x = arr.find(y => y.id === o.id); Object.assign(x, o); return { ...x }; }
    const n = { ...o, id: uid(), created_at: new Date().toISOString() }; arr.push(n); return { ...n };
  };
  return {
    members: async () => st.members.map(x => ({ ...x })),
    tasks: async () => st.tasks.map(x => ({ ...x })),
    checks: async (f, t) => [...st.checks].map(k => { const [task_id, date] = k.split("|"); return { task_id, date, ...st.info.get(k) }; })
      .filter(r => r.date >= f && r.date <= t),
    saveMember: async m => upsert(st.members, m),
    deleteMember: async id => {

// Tiruan save_submission() + trigger server untuk mod demo (logik sama dengan migration_v3.sql)
function demoSave(st, task_id, date, p) {
  const t = st.tasks.find(x => x.id === task_id); if (!t) throw new Error("Tugasan tidak wujud");
  if (p.p_ticked == null && !p.p_set_comment && !p.p_set_links) throw new Error("Tiada perubahan untuk disimpan");
  const k = task_id + "|" + date, old = st.subs.get(k), now = new Date().toISOString();
  const norm = v => ((v ?? "") + "").trim() || null, cleanL = a => (a || []).map(x => x.trim()).filter(Boolean);
  const conflict = f => Object.assign(new Error(`KONFLIK: ${f} telah dikemas kini oleh pengguna lain. Muat semula dan semak sebelum simpan.`), { code: "PT409" });
  if (old && p.p_set_comment && old.comment !== norm(p.p_base_comment)) throw conflict("komen");
  if (old && p.p_set_links && old.links.join("\n") !== (p.p_base_links || []).join("\n")) throw conflict("link");
  const legacy = old ? old.legacy : st.checks.has(k);
  const n = old ? { ...old, links: [...old.links] } : { id: uid(), task_id, date, ticked: p.p_ticked ?? legacy, comment: null, links: [], legacy,
    submitted_by: ME.id, submitted_at: now, updated_by: null, updated_at: null };
  if (old && p.p_ticked != null) n.ticked = !!p.p_ticked;
  if (p.p_set_comment) n.comment = norm(p.p_comment);
  if (p.p_set_links) n.links = cleanL(p.p_links);
  if (old) { n.updated_by = ME.id; n.updated_at = now; }
  const cs = inputSettings(t);
  n.rules = old ? old.rules : { ...cs, use_check: cs.use_check || legacy, comment_required: cs.comment_required && !legacy, proof_required: cs.proof_required && !legacy, legacy };
  if (n.comment && n.comment.length > 5000) throw new Error("Komen terlalu panjang (maksimum 5000 aksara)");
  if (n.links.length > 20) throw new Error("Terlalu banyak link (maksimum 20)");
  for (const l of n.links) if (!/^https?:\/\/\S+$/i.test(l)) throw new Error(`Link tidak sah: ${l} (mesti bermula dengan http:// atau https://)`);
  if ((!old || n.comment !== old.comment) && n.comment && !cs.use_comment) throw new Error("Ruangan komen tidak diaktifkan untuk tugasan ini");
  if ((!old || n.links.join() !== old.links.join()) && n.links.length) {
    if (!cs.use_proof) throw new Error("Ruangan link tidak diaktifkan untuk tugasan ini");
    if (!cs.proof_multi && n.links.length > 1) throw new Error("Tugasan ini hanya menerima satu link");
  }
  if ((!old || n.ticked !== old.ticked) && n.ticked && !(cs.use_check || n.rules.use_check)) throw new Error("Checkbox tidak diaktifkan untuk tugasan ini");
  n.completed = completion(effectiveRules(t, n), n);
  if (!old && legacy) { const i = st.info.get(k) || {};
    st.hist.push({ id: st.hist.length + 1, submission_id: n.id, task_id, date, action: "legacy", ticked: true, completed: true, filled_by: i.done_by, filled_at: i.done_at, changed_by: ME.id, changed_at: now }); }
  if (old && (old.ticked !== n.ticked || old.comment !== n.comment || old.links.join() !== n.links.join() || old.completed !== n.completed))
    st.hist.push({ id: st.hist.length + 1, submission_id: old.id, task_id, date, action: "update", ticked: old.ticked, comment: old.comment,
      links: old.links, completed: old.completed, filled_by: old.updated_by || old.submitted_by, filled_at: old.updated_at || old.submitted_at, changed_by: ME.id, changed_at: now });
  st.subs.set(k, n);
  if (n.completed) { if (!st.checks.has(k)) { st.checks.add(k); st.info.set(k, { done_by: ME.id, done_at: now }); } }
  else { st.checks.delete(k); st.info.delete(k); }
  return { ...n, links: [...n.links] };
}

async function ensureAttend(f, t) {
  if (S.attRange && f >= S.attRange[0] && t <= S.attRange[1]) return;
  if (S.attRange) { if (S.attRange[0] < f) f = S.attRange[0]; if (S.attRange[1] > t) t = S.attRange[1]; }
  const rows = await api.attends(f, t);
  for (const r of rows) S.attendance.set(r.member_id + "|" + r.date, r.status);
  S.attRange = [f, t];
}
async function ensure(f, t) {
  if (S.range && f >= S.range[0] && t <= S.range[1]) return;
  if (S.range) { if (S.range[0] < f) f = S.range[0]; if (S.range[1] > t) t = S.range[1]; }
  const rows = await api.checks(f, t);
  S.done = new Set(rows.map(r => r.task_id + "|" + r.date));
  S.info = new Map(rows.map(r => [r.task_id + "|" + r.date, { by: r.done_by, at: r.done_at }]));
  S.range = [f, t];
}
// isian (komen / link) dimuat ikut julat yang sedang dilihat sahaja (jimat data)
async function ensureSubs(f, t) {
  if (S.subRange && f >= S.subRange[0] && t <= S.subRange[1]) return;
  const rows = await api.subs(f, t);
  for (const r of rows) S.subs.set(r.task_id + "|" + r.date, r);
  const R = S.subRange, touching = R && !(t < addDays(R[0], -1) || f > addDays(R[1], 1));
  S.subRange = touching ? [f < R[0] ? f : R[0], t > R[1] ? t : R[1]] : [f, t];   // hanya gabung julat yang bersambung
}

// ---------- v3: tetapan input tugasan ----------
const inputSettings = t => ({ use_check: t.use_check !== false, use_comment: !!t.use_comment, comment_required: !!(t.use_comment && t.comment_required),
  use_proof: !!t.use_proof, proof_required: !!(t.use_proof && t.proof_required), proof_multi: !!(t.use_proof && t.proof_multi) });
const hasInputs = t => !!(t.use_comment || t.use_proof);
// Peraturan BERKESAN untuk satu rekod (sama dengan server):
//  • rekod sedia ada → peraturan DIBEKUKAN semasa ia dicipta (rules); syarat wajib digugurkan jika ruangan kini OFF
//  • tiada rekod tapi tarikh sudah ditick dalam v2 → "tick lama": cukup dengan tick
//  • selain itu → tetapan tugasan semasa
function effectiveRules(t, s, d) {
  const cs = inputSettings(t);
  if (s && s.rules) return { use_check: !!s.rules.use_check, comment_required: !!s.rules.comment_required && cs.use_comment,
    proof_required: !!s.rules.proof_required && cs.use_proof, legacy: !!s.legacy };
  if (!s && d && isDone(t, d)) return { use_check: true, comment_required: false, proof_required: false, legacy: true };
  return { use_check: cs.use_check, comment_required: cs.comment_required, proof_required: cs.proof_required, legacy: false };
}
function completion(r, s) {
  const hc = !!((s.comment || "") + "").trim(), hl = (s.links || []).some(x => x.trim());
  const ok = !(r.comment_required && !hc) && !(r.proof_required && !hl);
  return r.use_check ? ok && !!s.ticked : ok && (hc || hl);
}
function ruleTxt(i) {
  if (!i.use_check && !i.use_comment && !i.use_proof) return "⚠️ Sekurang-kurangnya satu input mesti ON.";
  const p = [];
  if (i.use_check) p.push("tick checkbox");
  if (i.comment_required) p.push("isi komen");
  if (i.proof_required) p.push("isi link bukti");
  if (!i.use_check && !p.length) p.push("hantar sekurang-kurangnya satu isian");
  return `Dikira <b>selesai</b> bila: ${p.join(" + ")}.`;
}
// Draf: nilai yang sedang ditaip + nilai ASAS (yang dilihat semasa mula edit) + tanda ruangan yang diubah
function draftOf(t, d) {
  const k = t.id + "|" + d, s = S.subs.get(k);
  let dr = S.drafts.get(k);
  if (!dr) {
    dr = { comment: s?.comment ?? "", links: s?.links?.length ? [...s.links] : [""],
      baseC: s?.comment ?? null, baseL: s?.links ? [...s.links] : [], dirtyC: false, dirtyL: false };
    S.drafts.set(k, dr);
  }
  return dr;
}

}
function missingList(t, c, r) {
  const m = [];
  if (r.use_check && !c.ticked) m.push("tick");
  if (r.comment_required && !c.comment.trim()) m.push("komen");

}
const nmOf = id => !id ? "—" : id === ME?.id ? "Anda" : S.people.get(id) || "Pengguna lain";
const fmtDT = iso => { const x = new Date(iso); return `${x.getDate()}/${x.getMonth() + 1}/${x.getFullYear()} ${pad(x.getHours())}:${pad(x.getMinutes())}`; };
const inputBadges = t => { const i = inputSettings(t); return [i.use_check ? `<span class="chip inp" title="Checkbox">☑ Tick</span>` : "",
  i.use_comment ? `<span class="chip inp" title="Komen ${i.comment_required ? "wajib" : "optional"}">💬 Komen${i.comment_required ? "*" : ""}</span>` : "",

function setMembers(all) { S.members = all.filter(m => !m.archived_at); S.archMembers = all.filter(m => m.archived_at); sortAll(); }

const memberOf = t => S.members.find(m => m.id === t.member_id);
const isDone = (t, d) => S.done.has(t.id + "|" + d);
function scheduled(t, d) {
  if (!t.active) return false;
  if (t.start_date && d < t.start_date) return false;
  const m = memberOf(t);
  if (!m || !m.active) return false;
  if (m.start_date && d < m.start_date) return false;
  if (m.end_date && d > m.end_date) return false;
  return (t.days || []).includes(parse(d).getDay());
}
const tasksFor = mid => S.tasks.filter(t => (!mid || t.member_id === mid) && memberOf(t));
function grouped(list) {
  const out = [];
  for (const m of S.members) {
    const ts = list.filter(t => t.member_id === m.id);
    if (!ts.length) continue;
    const secs = [];
    for (const t of ts) { let s = secs.find(x => x.name === t.section); if (!s) secs.push(s = { name: t.section, tasks: [] }); s.tasks.push(t); }
    out.push({ m, secs });
  }
  return out;
}
function stats(mid, ws) {
  const T = today();
  let sch = 0, done = 0, miss = 0, pend = 0, exempt = 0;
  let kpiDone = 0, kpiTarget = 0;
  const missed = [];

  for (let i = 0; i < 7; i++) {
    const d = addDays(ws, i);
    let dayDone = 0, daySch = 0;

    for (const t of S.tasks) {
      if (t.member_id !== mid || !scheduled(t, d)) continue;
      sch++;
      if (isTaskExempted(t, d)) { exempt++; continue; }    // cuti/mc/off_day: langkau sepenuhnya
      daySch++;
      if (isDone(t, d)) { done++; dayDone++; }
      else if (d < T) { miss++; missed.push([t, d]); }
      else pend++;
    }

    // Kira sasaran KPI hari ini
    if (daySch > 0) {
      const target = isHalfDay(mid, d) ? halfDayTarget(daySch) : daySch;
      kpiTarget += target;
      kpiDone   += Math.min(dayDone, target);  // cap pada sasaran (Half Day tak boleh >100%)
    }
  }

  const pct = kpiTarget > 0 ? Math.min(100, Math.round(kpiDone * 100 / kpiTarget)) : null;
  return { sch, done, miss, pend, missed, exempt, kpiDone, kpiTarget, pct };
}
function staleList() {
  const T = today(), out = [];
  for (const t of S.tasks) {
    const m = memberOf(t);
    if (!m || !m.active || !t.active || isDone(t, T)) continue;
    let last = null, missed = 0;
    for (let i = 1; i <= 120; i++) {
      const d = addDays(T, -i);
      if (isDone(t, d)) { last = d; break; }
      if (scheduled(t, d)) missed++;
    }
    if (missed >= S.stale) out.push({ t, m, last, missed, ago: last ? daysBetween(last, T) : null });
  }
  return out.sort((a, b) => b.missed - a.missed);
}

const ATT_STATUS = {
  hadir:          { label: "✅ Hadir",          cls: "att-hadir",  kpi: "normal"  },
  half_am:        { label: "🌅 Half Day AM",     cls: "att-half",   kpi: "half_am" },
  half_pm:        { label: "🌇 Half Day PM",     cls: "att-half",   kpi: "half_pm" },
  cuti:           { label: "🏖️ Cuti",            cls: "att-cuti",   kpi: "exempt"  },
  mc:             { label: "🏥 MC",              cls: "att-mc",     kpi: "exempt"  },
  off_day:        { label: "🛑 Off Day",         cls: "att-off",    kpi: "exempt"  },
  tidak_hadir:    { label: "⚠️ Tidak Hadir",     cls: "att-absent", kpi: "normal"  },
  belum_disahkan: { label: "❓ Belum Disahkan",  cls: "att-pending",kpi: "normal"  },
};

// Ambil status kehadiran semasa (default: belum_disahkan)
// Ahad (DOW=0) = automatik off_day — tiada rekod DB diperlukan
const getAttend = (mid, d) => {
  if (parse(d).getDay() === 0) return "off_day";
  return S.attendance.get(mid + "|" + d) || "belum_disahkan";
};

// Tentukan sama ada task ini "pagi" atau "petang" berdasarkan medan 'time'
function taskPeriod(t) {
  if (!t.time) return "pm";                                  // tiada masa → anggap petang/seharian
  const s = t.time.toLowerCase();
  if (/pm|petang|malam/i.test(s)) return "pm";
  if (/am|pagi/i.test(s)) return "am";
  const m = s.match(/(\d{1,2})[:.](\d{2})/);               // cuba parse format "10:00" atau "10.00"
  if (m) return parseInt(m[1]) < 12 ? "am" : "pm";
  return "pm";
}

// Adakah task ini dikecualikan dari KPI pada tarikh ini?
// Half Day TIDAK dikecualikan — KPI diselaraskan melalui formula sasaran 50%
function isTaskExempted(t, d) {
  return ["cuti", "mc", "off_day"].includes(getAttend(t.member_id, d));
}

// Adakah hari ini Half Day (AM atau PM)?
const isHalfDay = (mid, d) => ["half_am", "half_pm"].includes(getAttend(mid, d));

// Adakah rekod ini dikunci untuk pengguna semasa?
// Staff tidak boleh edit atau tick submission hari lepas (selepas midnight KL)
const isLocked = d => ME?.role === "staff" && d < today();

// Sasaran KPI Half Day = CEIL(jumlah task × 0.5), minimum 1 jika ada task
const halfDayTarget = sch => sch > 0 ? Math.ceil(sch * 0.5) : 0;

// Statistik kehadiran bagi satu minggu (hanya hari ada task dijadualkan)
function attendStats(mid, ws) {
  const counts = {};
  for (const k of Object.keys(ATT_STATUS)) counts[k] = 0;
  const m = S.members.find(x => x.id === mid);
  for (let i = 0; i < 7; i++) {
    const d = addDays(ws, i);
    if (!m || (m.start_date && d < m.start_date) || (m.end_date && d > m.end_date)) continue;
    if (!S.tasks.some(t => t.member_id === mid && scheduled(t, d))) continue; // skip hari tiada task
    counts[getAttend(mid, d)]++;
  }
  return counts;
}

// Kira Attendance Rate untuk hari LEPAS dalam minggu ini
// Ahad & cuti/mc/off_day dikecualikan dari denominator
// belum_disahkan (hari lepas) → rate = null, belum boleh dikira
function attendanceRate(mid, ws) {
  const m = S.members.find(x => x.id === mid);
  const T = today();
  let workDays = 0, hadirSetara = 0, pendingDays = 0;
  for (let i = 0; i < 7; i++) {
    const d = addDays(ws, i);
    if (d > T) continue; // hari akan datang — langkau
    if (!m || (m.start_date && d < m.start_date) || (m.end_date && d > m.end_date)) continue;
    if (parse(d).getDay() === 0) continue; // Ahad = auto off_day, bukan working day
    // Hanya kira hari yang ada task ATAU ada rekod attendance
    const hasTasks = S.tasks.some(t => t.member_id === mid && scheduled(t, d));
    const hasRecord = S.attendance.has(mid + "|" + d);
    if (!hasTasks && !hasRecord) continue;
    const status = getAttend(mid, d);
    // cuti/mc/off_day yang diluluskan → dikecualikan dari denominator
    if (["cuti", "mc", "off_day"].includes(status)) continue;
    workDays++;
    if (status === "belum_disahkan") { pendingDays++; continue; }
    if (status === "hadir") hadirSetara += 1;
    else if (status === "half_am" || status === "half_pm") hadirSetara += 0.5;
    // tidak_hadir → 0
  }
  const rate = workDays > 0 && pendingDays === 0
    ? Math.round(hadirSetara * 100 / workDays) : null;
  return { rate, workDays, pendingDays, hadirSetara };
}

// Sel kehadiran padat untuk jadual Ringkasan (tanpa wrapper div)

    ].join("");

    return `<div class="att-widget"><span class="att-label">Kehadiran:</span>
      <span class="badge att-badge ${info.cls}">${info.label}</span></div>`;
  }

  // Owner/Admin: dropdown penuh
  const opts = Object.entries(ATT_STATUS)
    .map(([v, i]) => `<option value="${v}" ${v === status ? "selected" : ""}>${i.label}</option>`).join("");
  const kpiNote = info.kpi === "exempt"
    ? `<span class="chip warn" style="font-size:12px">Task hari ini dikecualikan dari KPI</span>` : "";
  return `<div class="att-widget"><span class="att-label">Kehadiran:</span>

function vToday() {
  const d = S.date, T = today();

  // Gate kehadiran untuk staff: hari ini sahaja
  // Jika belum_disahkan → sembunyikan senarai task, tunjuk dropdown kehadiran sahaja
  if (can.isStaff() && ME.member_id && d === T && parse(d).getDay() !== 0) {

      return `<div class="card"><h2>Checklist Harian — ${DN[parse(d).getDay()]} ${dm(d)}</h2>
        <div class="att-widget" style="padding:16px 0">
          <span class="att-label">Status Kehadiran Hari Ini:</span>
          <select data-att-mid="${ME.member_id}" data-att-d="${d}">${opts}</select>
        </div>
        <p class="mute" style="margin-top:8px">Sila isi kehadiran terlebih dahulu untuk melihat task hari ini.</p></div>`;
    }
  }

  const list = tasksFor(S.member).filter(t => scheduled(t, d));
  const activeList = list.filter(t => !isTaskExempted(t, d));
  const doneCount = activeList.filter(t => isDone(t, d)).length;

  // Kira KPI selaras per member kemudian gabung
  let kpiDoneAll = 0, kpiTargetAll = 0;
  const viewMembers = S.member
    ? S.members.filter(m => m.id === S.member)
    : S.members.filter(m => m.active);
  for (const m of viewMembers) {
    const mTasks = activeList.filter(t => t.member_id === m.id);
    const mDone  = mTasks.filter(t => isDone(t, d)).length;
    if (mTasks.length === 0) continue;
    const target = isHalfDay(m.id, d) ? halfDayTarget(mTasks.length) : mTasks.length;
    kpiTargetAll += target;
    kpiDoneAll   += Math.min(mDone, target);
  }
  const kpiPct = kpiTargetAll > 0 ? Math.min(100, Math.round(kpiDoneAll * 100 / kpiTargetAll)) : 0;

  // Paparan: kalau ada Half Day, tunjuk dua maklumat berasingan
  const hasHD = viewMembers.some(m => activeList.some(t => t.member_id === m.id) && isHalfDay(m.id, d));
  const progTxt = hasHD
    ? `<b>${doneCount}/${activeList.length}</b> task siap &nbsp;·&nbsp; KPI: <b>${kpiPct}%</b> <span class="mute">(sasaran ${kpiTargetAll} task)</span>`
    : `<b>${doneCount}/${list.length}</b> siap · ${kpiPct}%`;

  let h = `<div class="card"><div class="tools">${memberSel(true)}
    <div class="datenav"><button data-act="day" data-n="-1">‹</button><input type="date" id="dateIn" value="${d}"><button data-act="day" data-n="1">›</button>
    ${d !== T ? `<button class="ghost sm" data-act="gotoday">Hari ini</button>` : ""}</div>
    <div class="dayname">${DN[parse(d).getDay()]}</div></div>
    <div class="prog"><div class="progtxt">${progTxt}</div><div class="pbar"><i style="width:${kpiPct}%"></i></div></div></div>`;
  if (!list.length) return h + `<div class="card empty">Tiada task dijadualkan untuk hari ni.</div>`;
  for (const g of grouped(list)) {
    h += `<div class="card"><h2>${esc(g.m.name)}<small>${esc(g.m.role || "")}</small></h2>${attendWidget(g.m.id, d)}`;
    for (const s of g.secs) {
      h += `<h3>${esc(s.name)}</h3><div class="tlist">` + s.tasks.map(t => taskRow(t, d, T)).join("") + `</div>`;
    }
    h += `</div>`;
  }
  return h;
}

  if (r.legacy) h += `<div class="note info">Tarikh ini sudah ditick sebelum tetapan input diubah. Ia kekal selesai; komen/link di sini adalah tambahan.</div>`;

    <textarea data-f="comment" data-k="${k}" maxlength="5000" placeholder="Catatan kerja...">${esc(cText)}</textarea></label>`;
  if (i.use_proof) h += `<div><label>🔗 Link bukti kerja ${r.proof_required ? `<span class="req">* wajib</span>` : "(optional)"}${i.proof_multi ? " · boleh lebih dari satu" : ""}</label>`
    + links.map((l, j) => `<div class="lrow"><input type="url" data-f="link" data-k="${k}" data-i="${j}" value="${esc(l)}" placeholder="https://...">${i.proof_multi && links.length > 1 ? `<button type="button" class="ghost sm" data-act="rmlink" data-k="${k}" data-i="${j}" title="Buang">✕</button>` : ""}</div>`).join("")
    + (i.proof_multi && links.length < 20 ? `<div style="margin-top:6px"><button type="button" class="ghost sm" data-act="addlink" data-k="${k}">+ Tambah link</button></div>` : "") + `</div>`;
  h += `<div class="rulehint">${ruleTxt({ ...r, use_comment: i.use_comment, use_proof: i.use_proof })}${r.use_check ? " Tick pada checkbox di atas." : ""}${s?.rules && !r.legacy ? " <span class='mute'>(peraturan semasa rekod ini dicipta)</span>" : ""}</div>`;
  h += `<div class="btns"><button type="button" data-act="savesub" data-k="${k}">${r.use_check ? "Simpan isian" : "Hantar"}</button>
    ${s ? `<button type="button" class="ghost sm" data-act="hist" data-k="${k}">${S.hist.has(k) ? "Sorok sejarah" : "Sejarah"}</button>` : ""}</div>`;
  if (s) {
    h += `<div class="meta">Diisi oleh <b>${esc(nmOf(s.submitted_by))}</b> · ${fmtDT(s.submitted_at)}${s.updated_at ? ` · Dikemas kini oleh <b>${esc(nmOf(s.updated_by))}</b> · ${fmtDT(s.updated_at)}` : ""}`;
    if (!i.use_comment && s.comment) h += `<br>Komen lama (ruangan kini dimatikan): “${esc(s.comment)}”`;
    if (!i.use_proof && s.links?.length) h += `<br>Link lama (ruangan kini dimatikan): ${s.links.map(l => `<a class="lnk" href="${esc(safeUrl(l))}" target="_blank" rel="noopener">${esc(l)}</a>`).join(", ")}`;
    h += `</div>`;
  }
  if (S.hist.has(k)) {
    const rows = S.hist.get(k);
    h += `<div class="hist"><b>Versi terdahulu</b>${rows.length ? rows.map(r => `<div>${fmtDT(r.filled_at)} · <b>${esc(nmOf(r.filled_by))}</b>: ${r.ticked ? "✓ ditick" : "tidak ditick"}${r.comment ? ` · komen: “${esc(r.comment.length > 80 ? r.comment.slice(0, 80) + "…" : r.comment)}”` : ""}${r.links?.length ? ` · ${r.links.length} link` : ""}${r.completed ? " · <span style='color:var(--ok)'>selesai</span>" : ""}
      <span class="mute">(${r.action === "legacy" ? "tick asal sebelum v3" : r.action === "delete" ? "dipadam" : "diubah"} oleh ${esc(nmOf(r.changed_by))}, ${fmtDT(r.changed_at)})</span></div>`).join("") : `<div class="mute">Tiada perubahan direkodkan.</div>`}</div>`;
  }
  return h + `</div>`;
}

// ---------- view: grid minggu (macam Google Sheet) ----------
function vWeek() {
  const days = [...Array(7)].map((_, i) => addDays(S.week, i)), T = today();
  const list = tasksFor(S.member).filter(t => days.some(d => scheduled(t, d)));
  let h = `<div class="card"><div class="tools">${memberSel(true)}${weekNav()}</div>
    <div class="legend"><span><i style="background:var(--okbg)"></i>Siap</span><span><i style="background:var(--badbg)"></i>Tertinggal</span>
    <span><i style="background:var(--warnbg)"></i>Belum lengkap (…)</span><span><i></i>Belum (klik untuk tanda / isi)</span><span><i style="background:repeating-linear-gradient(45deg,#fafafa,#fafafa 3px,#e5e7eb 3px,#e5e7eb 6px)"></i>Tak dijadualkan</span></div></div>`;
  if (!list.length) return h + `<div class="card empty">Tiada task untuk minggu ni.</div>`;
  h += `<div class="card scroll"><table class="grid"><thead><tr><th class="tcol">Task</th>${days.map(d => `<th class="${d === T ? "today" : ""}">${DS[parse(d).getDay()]}<br><small>${dm(d)}</small></th>`).join("")}<th>Siap</th></tr></thead><tbody>`;
  const col = days.map(() => [0, 0]);
  for (const g of grouped(list)) {
    if (!S.member) h += `<tr class="mem"><td colspan="9">${esc(g.m.name)}</td></tr>`;
    for (const s of g.secs) {
      h += `<tr class="sec"><td colspan="9">${esc(s.name)}</td></tr>`;
      for (const t of s.tasks) {
        let a = 0, b = 0;
        const cells = days.map((d, i) => {
          if (!scheduled(t, d)) return `<td class="na"></td>`;
          const ok = isDone(t, d); b++; col[i][1]++; if (ok) { a++; col[i][0]++; }
          const sb_ = S.subs.get(t.id + "|" + d), part = !ok && !!sb_ && (sb_.ticked || !!sb_.comment || (sb_.links || []).length > 0);
          const needPanel = hasInputs(t) || t.use_check === false;
          const cls = ok ? "ok" : part ? "part" : d < T ? "miss" : "todo";
          let tip = `${DN[parse(d).getDay()]} ${dm(d)}${ok ? " — selesai: " + whoTxt(t, d) : part ? " — belum lengkap" : ""}`;
          if (sb_?.comment) tip += `\nKomen: ${sb_.comment.slice(0, 120)}`;
          if (sb_?.links?.length) tip += `\n${sb_.links.length} link bukti`;
          if (needPanel) tip += "\n(klik untuk isi / lihat)";
          return `<td class="cell ${cls} ${d === T ? "now" : ""}" data-t="${t.id}" data-d="${d}" ${needPanel ? `data-panel="1"` : ""} title="${esc(tip)}">${ok ? "✓" : part ? "…" : d < T ? "✗" : needPanel ? "✎" : ""}</td>`;
        }).join("");
        h += `<tr><td class="tcol">${esc(t.title)} ${t.time ? `<span class="chip">${esc(t.time)}</span>` : ""} ${hasInputs(t) ? inputBadges(t) : ""} ${link(t)}</td>${cells}<td class="cnt">${a}/${b}</td></tr>`;
      }
    }
  }
  // Footer: kira KPI selaras per hari (Half Day menggunakan sasaran 50%)
  const colAdj = days.map((d, i) => {
    let kpiD = 0, kpiT = 0;
    for (const m of S.members.filter(m => m.active)) {
      if (S.member && m.id !== S.member) continue;
      const mt = S.tasks.filter(t => t.member_id === m.id && scheduled(t, d) && !isTaskExempted(t, d));
      if (!mt.length) continue;
      const mDone = mt.filter(t => isDone(t, d)).length;
      const target = isHalfDay(m.id, d) ? halfDayTarget(mt.length) : mt.length;
      kpiT += target; kpiD += Math.min(mDone, target);
    }
    return [kpiD, kpiT];
  });
  h += `</tbody><tfoot><tr><td class="tcol">KPI sehari</td>${colAdj.map(([a, b]) => `<td>${b ? Math.min(100, Math.round(a * 100 / b)) + "%" : ""}</td>`).join("")}<td></td></tr></tfoot></table></div>`;
  return h;
}

// ---------- view: ringkasan ----------
function vSummary() {
  const ms = S.members.filter(m => m.active);
  let h = `<div class="card"><div class="tools"><h2 style="margin:0">Ringkasan mingguan</h2>${weekNav()}</div></div><div class="cards">`;
  const all = [];
  for (const m of ms) {
    const s = stats(m.id, S.week); all.push([m, s]);
    const trend = [3, 2, 1].map(k => stats(m.id, addDays(S.week, -7 * k)).pct);
    const cls = s.pct == null ? "" : s.pct >= 90 ? "good" : s.pct >= 70 ? "mid" : "low";
    const ar = attendanceRate(m.id, S.week);
    const arTxt = ar.rate !== null
      ? `<b>${ar.rate}%</b>`
      : ar.workDays > 0
        ? `❓ <span class="mute">(${ar.pendingDays} hari belum disahkan)</span>`
        : `<span class="mute">—</span>`;
    const exemptNote = s.exempt ? `<span class="mute"> · <b>${s.exempt}</b> dikecualikan</span>` : "";
    const halfNote   = s.kpiTarget < (s.sch - s.exempt) && s.kpiTarget > 0
      ? `<span class="mute"> · sasaran KPI <b>${s.kpiTarget}</b> task</span>` : "";
    const T2 = today();
    const days7 = Array.from({length: 7}, (_, i) => addDays(S.week, i));
    let attTable = `<table class="tbl att-week"><thead><tr><th>Hari</th><th>Tarikh</th><th>Kehadiran</th><th>Task</th></tr></thead><tbody>`;
    for (const d of days7) {
      const isToday = d === T2, isFuture = d > T2;
      const dayTasks = S.tasks.filter(t => t.member_id === m.id && scheduled(t, d) && !isTaskExempted(t, d));
      const dayDone = dayTasks.filter(t => isDone(t, d)).length;
      const taskCell = dayTasks.length > 0 ? `${dayDone}/${dayTasks.length}` : `<span class="mute">—</span>`;
      const rowCls = isToday ? ' class="att-today"' : isFuture ? ' class="att-future"' : '';
      attTable += `<tr${rowCls}><td>${DN[parse(d).getDay()]}</td><td>${dm(d)}</td><td>${attCell(m.id, d)}</td><td>${taskCell}</td></tr>`;
    }
    attTable += `</tbody><tfoot><tr><td colspan="2">Kehadiran minggu ini</td><td>${arTxt}</td><td>KPI: ${s.pct != null ? s.pct + "%" : "<span class='mute'>—</span>"}</td></tr></tfoot></table>`;
    h += `<div class="card"><div class="mtop"><div><b>${esc(m.name)}</b><div class="mute">${esc(m.role || "")}</div></div><div class="pct ${cls}">${s.pct == null ? "–" : s.pct + "%"}</div></div>
      <div class="pbar"><i style="width:${s.pct || 0}%"></i></div>
      <div class="nums"><span><b>${s.done}</b> siap</span><span class="bad"><b>${s.miss}</b> tertinggal</span><span><b>${s.pend}</b> belum sampai</span>${exemptNote}${halfNote}</div>
      ${attTable}
      <div class="trend mute">Trend: ${trend.map(p => p == null ? "–" : p + "%").join(" → ")} → <b>${s.pct == null ? "–" : s.pct + "%"}</b></div>
      <button class="ghost sm" data-act="openweek" data-m="${m.id}">Lihat grid ›</button></div>`;
  }
  h += `</div>`;
  const rows = [];
  for (const [m, s] of all) {
    const by = new Map();
    for (const [t, d] of s.missed) { if (!by.has(t.id)) by.set(t.id, { t, ds: [] }); by.get(t.id).ds.push(d); }
    for (const v of by.values()) rows.push({ m, ...v });
  }
  rows.sort((a, b) => b.ds.length - a.ds.length);
  const tot = rows.reduce((a, r) => a + r.ds.length, 0);
  h += `<div class="card"><h2>Tertinggal minggu ni <span class="badge bad">${tot}</span></h2>${rows.length ? `<table class="tbl"><thead><tr><th>Member</th><th>Bahagian</th><th>Task</th><th>Hari tertinggal</th></tr></thead><tbody>${rows.map(r =>
    `<tr><td>${esc(r.m.name)}</td><td>${esc(r.t.section)}</td><td>${esc(r.t.title)}</td><td>${r.ds.map(d => `<span class="chip bad">${DS[parse(d).getDay()]} ${dm(d)}</span>`).join(" ")}</td></tr>`).join("")}</tbody></table>` : `<p class="mute">Takde yang tertinggal minggu ni. 👍</p>`}</div>`;
  const st = staleList();
  h += `<div class="card"><h2>Dah lama tak buat <span class="badge warn">${st.length}</span></h2>
    <p class="mute">Dikira dari hari ini: task yang dah terlepas <input type="number" id="staleIn" class="num" min="1" value="${S.stale}"> kali atau lebih berturut-turut.</p>
    ${st.length ? `<table class="tbl"><thead><tr><th>Member</th><th>Bahagian</th><th>Task</th><th>Terakhir buat</th><th>Terlepas</th></tr></thead><tbody>${st.map(x =>
      `<tr><td>${esc(x.m.name)}</td><td>${esc(x.t.section)}</td><td>${esc(x.t.title)} ${link(x.t)}</td><td>${x.last ? `${DS[parse(x.last).getDay()]} ${dm(x.last)} <span class="mute">(${x.ago} hari lepas)</span>` : `<span class="chip bad">Belum pernah buat</span>`}</td><td><b>${x.missed}</b> kali</td></tr>`).join("")}</tbody></table>`
      : `<p class="mute">Semua task aktif masih berjalan. 👍</p>`}</div>`;
  return h;
}

      <button class="ghost sm" data-act="editmember" data-m="${m.id}">Edit member</button><button class="ghost sm" data-act="bulk">+ Tambah pukal</button><button class="sm" data-act="newtask">+ Task</button></div>
      <p class="mute">${esc(m.role || "")}${m.start_date ? " · Mula " + dm(m.start_date) : ""}${m.end_date ? " · Tamat " + dm(m.end_date) : ""} · ${ts.length} task</p>
      ${S.editTask ? taskForm(S.editTask) : ""}${S.bulk ? bulkForm() : ""}`;

    for (const g of grouped(ts)) for (const s of g.secs) {
      h += `<h3>${esc(s.name)}</h3><table class="tbl fix"><tbody>${s.tasks.map(t => `<tr class="${t.active ? "" : "off"}"><td>${esc(t.title)} ${link(t)}<div style="margin-top:3px">${inputBadges(t)}</div></td><td class="mute">${esc(t.time || "")}</td><td class="mute">${daysTxt(t.days || [])}</td>

    }
    h += `</div>`;
  } else h += `<div class="card empty">Tambah member dulu (butang <b>+ Member</b>).</div>`;
  return h + `</div></div>`;
}

  const ts = S.tasks.filter(t => t.member_id === myMember.id);

  let h = `<div class="card"><div class="tools"><h2 style="margin:0">${esc(myMember.name)}</h2><div class="spacer"></div>

  if (myTasks.length) {

  h += `</div>`;
  return h;

function readInputs(fd) {
  const use_comment = fd.has("use_comment"), use_proof = fd.has("use_proof");
  return { use_check: fd.has("use_check"), use_comment, comment_required: use_comment && fd.get("comment_required") === "1",
    use_proof, proof_required: use_proof && fd.get("proof_required") === "1", proof_multi: use_proof && fd.has("proof_multi") };
}
function syncInputForm(form) {
  const i = readInputs(new FormData(form));
  form.querySelector('[name="comment_required"]').disabled = !i.use_comment;
  form.querySelector('[name="proof_required"]').disabled = !i.use_proof;
  form.querySelector('[name="proof_multi"]').disabled = !i.use_proof;
  form.querySelector('[name="proof_multi"]').closest("label").classList.toggle("dis", !i.use_proof);
  const r = form.querySelector("[data-rule]"); r.innerHTML = ruleTxt(i);

}

function archRecords() {

      <td>${x?.links?.length ? x.links.map(l => `<a class="lnk" href="${esc(safeUrl(l))}" target="_blank" rel="noopener">${esc(l)}</a>`).join("<br>") : "—"}</td><td>${by}</td></tr>`;
  }).join("")}</tbody></table>` : `<p class="mute">Tiada rekod.</p>`;
  h += `<div class="hist" style="margin-top:8px"><b>Sejarah perubahan (${R.hist.length})</b>${R.hist.length ? R.hist.map(r => `<div>${dm(r.date)} · ${r.filled_at ? fmtDT(r.filled_at) : "—"} · <b>${esc(nmOf(r.filled_by))}</b>: ${r.ticked ? "✓ ditick" : "tidak ditick"}${r.comment ? ` · komen: “${esc(r.comment.length > 80 ? r.comment.slice(0, 80) + "…" : r.comment)}”` : ""}${r.links?.length ? ` · ${r.links.length} link` : ""}

  return h;
}

function toast(msg, bad) {
  const t = $("#toast"); t.textContent = msg; t.className = "show" + (bad ? " bad" : "");
  clearTimeout(toast.h); toast.h = setTimeout(() => (t.className = ""), 2600);
}
const isConflict = e => e?.code === "PT409" || /KONFLIK/.test(e?.message || "");
// Simpan ke server melalui RPC atomik. Server tentukan "selesai" & tulis rekod checks.
async function submit(t, d, params) {
  const k = t.id + "|" + d, wasDone = S.done.has(k);
  let saved;
  try { saved = await api.save(t.id, d, params); }
  catch (e) {
    if (!isConflict(e)) throw e;
    // KONFLIK: muat nilai terkini; draf pengguna dikekalkan, nilai asas dikemas kini
    for (const r of await api.subs(d, d)) S.subs.set(r.task_id + "|" + r.date, r);
    const s = S.subs.get(k), dr = S.drafts.get(k);
    if (dr) { dr.baseC = s?.comment ?? null; dr.baseL = s?.links ? [...s.links] : []; }
    if (s) { if (s.completed) S.done.add(k); else { S.done.delete(k); S.info.delete(k); } }
    S.conflict.add(k); S.open.add(k);
    throw new Error("Rekod ini baru dikemas kini oleh pengguna lain. Nilai terkini ditunjukkan dalam panel. Semak, kemudian simpan semula.");
  }
  S.subs.set(k, saved); S.conflict.delete(k);
  if (saved.completed) { S.done.add(k); if (!wasDone || !S.info.get(k)) S.info.set(k, { by: ME.id, at: new Date().toISOString() }); }
  else { S.done.delete(k); S.info.delete(k); }
  S.hist.delete(k);
  return saved;
}
// Parameter dari draf: HANYA ruangan yang diubah, bersama nilai asas (untuk semakan konflik)
function draftParams(t, d) {
  const k = t.id + "|" + d, dr = S.drafts.get(k), i = inputSettings(t), p = {};
  if (!dr) return p;
  if (dr.dirtyC && i.use_comment) { p.p_set_comment = true; p.p_comment = dr.comment; p.p_base_comment = dr.baseC; }
  if (dr.dirtyL && i.use_proof) {
    const links = dr.links.map(x => x.trim()).filter(Boolean);
    const bad = links.find(l => !/^https?:\/\/\S+$/i.test(l));
    if (bad) throw new Error(`Link tidak sah: ${bad}. Mesti bermula dengan https://`);
    if (!i.proof_multi && links.length > 1) throw new Error("Tugasan ini hanya menerima satu link");
    p.p_set_links = true; p.p_links = links; p.p_base_links = dr.baseL;
  }
  return p;
}
const clearDraft = (k, p) => { const dr = S.drafts.get(k); if (!dr) return;
  if (p.p_set_comment) dr.dirtyC = false; if (p.p_set_links) dr.dirtyL = false;
  if (!dr.dirtyC && !dr.dirtyL) S.drafts.delete(k); };
async function toggle(tid, d, on) {
  if (isLocked(d)) return toast("🔒 Rekod ini sudah dikunci. Hubungi Owner atau Admin untuk pindaan.", 1);
  const t = S.tasks.find(x => x.id === tid); if (!t) return;
  const k = tid + "|" + d, r = effectiveRules(t, S.subs.get(k), d);
  if (!inputSettings(t).use_check && !r.use_check) { S.open.add(k); return render(); }
  if (!hasInputs(t)) {                       // Checkbox sahaja: kemas kini terus (optimistic)
    const prevD = S.done.has(k), prevI = S.info.get(k);
    if (on) { S.done.add(k); S.info.set(k, { by: ME.id, at: new Date().toISOString() }); } else { S.done.delete(k); S.info.delete(k); }
    render();
    try { await submit(t, d, { p_ticked: on }); }
    catch (e) { prevD ? S.done.add(k) : S.done.delete(k); prevI ? S.info.set(k, prevI) : S.info.delete(k); toast("Gagal simpan: " + errMsg(e), 1); }
    return render();
  }
  try {
    const p = { p_ticked: on, ...draftParams(t, d) };   // tick + (jika ada) ruangan yang sedang diedit
    const saved = await submit(t, d, p);
    clearDraft(k, p);
    const s = S.subs.get(k);
    if (on && !saved.completed) { S.open.add(k); toast("Ditick, tapi belum selesai. Lengkapkan: " + missingList(t, cur(t, d), effectiveRules(t, s, d)).join(", "), 1); }
    else if (saved.completed) toast("✓ Selesai");
  } catch (e) { toast((isConflict(e) ? "" : "Gagal simpan: ") + errMsg(e), 1); }
  render();
}
const closeForms = () => { S.editTask = null; S.editMember = null; S.bulk = false; };

async function reloadUsers() {

document.addEventListener("click", async e => {
  const tab = e.target.closest("[data-tab]");
  if (tab) {
    S.tab = tab.dataset.tab; closeForms();
    if (S.tab === "users" && can.users()) { $("#app").innerHTML = `<div class="card empty">Loading…</div>`; try { await reloadUsers(); } catch (err) { toast(errMsg(err), 1); } }
    return render();
  }
  const cell = e.target.closest("td.cell");
  if (cell) {
    const t = S.tasks.find(x => x.id === cell.dataset.t), d = cell.dataset.d;
    if (cell.dataset.panel) {               // tugasan ada komen/link: buka panel dalam Checklist Harian
      S.date = d; if (can.manage()) S.member = t.member_id; S.open.add(t.id + "|" + d); S.tab = "today";
      try { await ensure(addDays(d, -1), d); await ensureSubs(d, d); } catch (err) { toast(errMsg(err), 1); }
      render(); document.querySelector(".ipanel")?.scrollIntoView({ block: "center" }); return;
    }
    const k = t.id + "|" + d, c = S.subs.get(k);
    return toggle(t.id, d, !(c ? c.ticked : S.done.has(k)));
  }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, n = +b.dataset.n;
  // --- skrin log masuk / daftar / lupa kata laluan ---
  if (a === "auth") { e.preventDefault(); return authView(b.dataset.mode); }
  if (a === "logout" || a === "cancelreset") { clearRecovery(); if (sb) await sb.auth.signOut(); return location.replace(location.pathname); }
  if (a === "recheck") return location.reload();
  if (a === "resend") {
    const email = b.dataset.email;
    const { error } = await sb.auth.resend({ type: "signup", email, options: { emailRedirectTo: SITE_URL } });
    return authView("login", error && isRateLimit(error)
      ? { bad: 1, html: "Terlalu banyak permintaan email. Sila tunggu beberapa minit dan cuba lagi." }
      : { html: "Jika akaun ini wujud dan belum disahkan, email pengesahan baharu telah dihantar. Semak Inbox &amp; folder Spam." });
  }
  try {
    if (a === "day") { S.date = addDays(S.date, n); await ensure(addDays(S.date, -1), S.date); await ensureSubs(S.date, S.date); await ensureAttend(S.date, S.date); }
    else if (a === "gotoday") { S.date = today(); await ensureAttend(S.date, S.date); }
    else if (a === "wk") { S.week = addDays(S.week, n); await ensure(addDays(S.week, -21), addDays(S.week, 6)); await ensureSubs(S.week, addDays(S.week, 6)); await ensureAttend(S.week, addDays(S.week, 6)); }
    // --- v3: panel isian ---
    else if (a === "panel") { const k = b.dataset.k; S.open.has(k) ? S.open.delete(k) : S.open.add(k); }
    else if (a === "addlink" || a === "rmlink") {
      const k = b.dataset.k, [tid, d] = k.split("|"), t = S.tasks.find(x => x.id === tid), dr = draftOf(t, d);
      if (a === "addlink") dr.links.push(""); else { dr.links.splice(+b.dataset.i, 1); if (!dr.links.length) dr.links = [""]; }
      dr.dirtyL = true;
    }
    else if (a === "savesub") {
      const k = b.dataset.k, [tid, d] = k.split("|"), t = S.tasks.find(x => x.id === tid);
      if (isLocked(d)) return toast("🔒 Rekod ini sudah dikunci. Hubungi Owner atau Admin untuk pindaan.", 1);
      const p = draftParams(t, d);                       // hanya ruangan yang diubah
      if (!p.p_set_comment && !p.p_set_links) return toast("Tiada perubahan untuk disimpan.", 1);
      b.disabled = true;
      const saved = await submit(t, d, p);

    else if (a === "delmember") {
      const m = S.members.find(x => x.id === b.dataset.m);
      if (!confirm(`Padam ${m.name}?\n\nJika member ini ada rekod kerja, member & semua tugasannya akan DIARKIBKAN: rekod & sejarah kekal dan boleh dilihat dalam tab Arkib.\nJika tiada sebarang rekod, ia dipadam terus.\n\n(Kalau sekadar dah berhenti kerja, cukup untick "Aktif".)`)) return;
      const r = await api.deleteMember(m.id);
      const [ms, ts] = await Promise.all([api.members(), api.tasks()]); setMembers(ms); setTasks(ts);
      closeForms(); toast(r === "archived" ? "Member ada rekod → diarkibkan bersama tugasannya" : "Member dipadam (tiada rekod)");
    }
    // --- arkib (Owner/Admin) ---
    else if (a === "archrec") {
      const tid = b.dataset.t;
      if (S.archView === tid) { S.archView = null; S.archRec = null; }
      else { S.archView = tid; S.archRec = null; render(); S.archRec = await api.taskRecords(tid); }
    }
    else if (a === "restoret") {
      const t = S.archTasks.find(x => x.id === b.dataset.t);
      if (!confirm(`Pulihkan tugasan "${t.title}"? Ia akan muncul semula dalam checklist.`)) return;
      await api.restoreTask(t.id); setTasks(await api.tasks()); if (S.archView === t.id) { S.archView = null; S.archRec = null; } toast("Tugasan dipulihkan");
    }
    else if (a === "restorem") {
      const m = S.archMembers.find(x => x.id === b.dataset.m);
      if (!confirm(`Pulihkan member ${m.name} berserta tugasan yang diarkibkan bersamanya?`)) return;
      await api.restoreMember(m.id);
      const [ms, ts] = await Promise.all([api.members(), api.tasks()]); setMembers(ms); setTasks(ts); toast("Member dipulihkan");
    }
    // --- pengurusan pengguna ---
    else if (a === "ufilter") S.ufilter = b.dataset.s;
    else if (a === "reloadusers") { await reloadUsers(); toast("Senarai dikemas kini"); }
    else if (a === "ustatus") {
      const u = S.users.find(x => x.id === b.dataset.u), s = b.dataset.s;
      const word = { approved: "Approve", rejected: "Reject", suspended: "Suspend" }[s];
      if (s !== "approved" && !confirm(`${word} akaun ${u.full_name}? Pengguna ini tidak akan dapat mengakses sistem.`)) return;
      await api.setStatus(u.id, s); await reloadUsers(); toast(`${u.full_name}: ${STATUS_LABEL[s]}`);
    }
    else if (a === "mkmember") {
      const u = S.users.find(x => x.id === b.dataset.u);
      if (!confirm(`Cipta rekod member baharu "${u.full_name}" dan hubungkan dengan akaun ini?`)) return;
      await api.createMemberFor(u.id); await reloadUsers(); setTasks(await api.tasks()); toast("Member dicipta & dihubungkan");
    }
    render();
  } catch (err) { toast(errMsg(err), 1); render(); }
});

document.addEventListener("change", async e => {
  const el = e.target;
  if (el.dataset.chk) return toggle(el.dataset.chk, el.dataset.d, el.checked);
  if (el.id === "memSel") { S.member = el.value; render(); }
  if (el.id === "dateIn" && el.value) { S.date = el.value; await ensure(addDays(S.date, -1), S.date); render(); }
  if (el.id === "staleIn") { S.stale = Math.max(1, +el.value || 1); render(); }
  if (el.dataset.attMid) {
    const mid = el.dataset.attMid, d = el.dataset.attD, status = el.value;
    if (!status) return; // placeholder "Sila Isi" dipilih — abaikan
    // Staff: hanya boleh ubah kehadiran diri sendiri untuk hari ini
    if (can.isStaff()) {
      const isOwn = ME?.member_id && mid === ME.member_id;
      if (!isOwn) return toast("Anda hanya boleh mengisi kehadiran diri sendiri.", 1);
      if (d !== today()) return toast("🔒 Kehadiran hanya boleh diisi untuk hari ini.", 1);
      if (!ATT_STATUS_STAFF.includes(status)) return toast("Status ini tidak boleh dipilih oleh Staff.", 1);
    } else if (!can.users()) {
      return toast("Tiada kebenaran untuk mengubah kehadiran.", 1);
    }
    try {
      await api.saveAttend(mid, d, status);
      S.attendance.set(mid + "|" + d, status);
      toast("✅ Kehadiran dikemas kini: " + (ATT_STATUS[status]?.label || status));
    } catch (e) { toast("Gagal simpan kehadiran: " + errMsg(e), 1); }
    render(); return;
  }
  if (el.form && ["taskForm", "bulkForm"].includes(el.form.id) && ["use_check", "use_comment", "use_proof", "proof_multi", "comment_required", "proof_required"].includes(el.name)) syncInputForm(el.form);
  try {
    if (el.dataset.roleFor) {
      const u = S.users.find(x => x.id === el.dataset.roleFor);
      if (!confirm(`Tukar role ${u.full_name} kepada ${ROLE_LABEL[el.value]}?`)) return render();
      await api.setRole(u.id, el.value); await reloadUsers(); toast("Role dikemas kini"); render();
    }
    if (el.dataset.linkFor) {
      await api.linkMember(el.dataset.linkFor, el.value || null); await reloadUsers(); toast(el.value ? "Akaun dihubungkan dengan member" : "Hubungan dibuang"); render();
    }
  } catch (err) { toast(errMsg(err), 1); render(); }
});

// draf isian (komen / link) disimpan semasa menaip supaya tak hilang bila skrin dikemas kini
document.addEventListener("input", e => {
  const el = e.target; if (!el.dataset?.f || !el.dataset.k) return;
  const k = el.dataset.k, [tid, d] = k.split("|"), t = S.tasks.find(x => x.id === tid); if (!t) return;
  const dr = draftOf(t, d);
  if (el.dataset.f === "comment") { dr.comment = el.value; dr.dirtyC = true; }
  if (el.dataset.f === "link") { if (!dr.links.length) dr.links = [""]; dr.links[+el.dataset.i] = el.value; dr.dirtyL = true; }
});

document.addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target, fd = new FormData(f), days = fd.getAll("days").map(Number);
  const val = k => (fd.get(k) || "").toString().trim();
  if (["loginForm", "registerForm", "forgotForm", "resetForm"].includes(f.id)) return authSubmit(f.id, val, fd, f);
  try {
    if (f.id === "memberForm") {
      const m = { ...S.editMember, name: val("name"), role: val("role"), start_date: val("start_date") || null, end_date: val("end_date") || null, active: fd.has("active") };
      const saved = await api.saveMember(m); upd(S.members, saved); sortAll();
      S.manageMember = saved.id; if (!S.member) S.member = saved.id; closeForms(); toast("Member disimpan");
    }
    else if (f.id === "taskForm") {
      if (!days.length) return toast("Pilih sekurang-kurangnya satu hari", 1);
      const inp = readInputs(fd);
      if (!inp.use_check && !inp.use_comment && !inp.use_proof) return toast("Tak boleh simpan: sekurang-kurangnya satu input (Checkbox / Komen / Link) mesti ON.", 1);
      // Staff: member_id terkunci kepada diri sendiri; created_by ditetapkan
      const forceMember = can.isStaff() ? ME.member_id : null;
      const t = { ...S.editTask, member_id: forceMember || S.editTask.member_id || S.manageMember,
        section: val("section"), title: val("title"), link: val("link"), time: val("time"),
        days, start_date: val("start_date") || today(), active: fd.has("active"), ...inp };
      if (!t.id) { t.sort = nextSort(); t.created_by = ME.id; } // task baru: set pemilik
      const saved = await api.saveTask(t); upd(S.tasks, saved); sortAll(); closeForms(); toast("Task disimpan");
    }
    else if (f.id === "bulkForm") {
      if (!days.length) return toast("Pilih sekurang-kurangnya satu hari", 1);
      const inp = readInputs(fd);
      if (!inp.use_check && !inp.use_comment && !inp.use_proof) return toast("Tak boleh simpan: sekurang-kurangnya satu input (Checkbox / Komen / Link) mesti ON.", 1);
      const base = nextSort();
      const bulkMember = can.isStaff() ? ME.member_id : S.manageMember;
      const arr = val("lines").split("\n").map(l => l.trim()).filter(Boolean).map((l, i) => {
        const [title, ...rest] = l.split("|");
        return { member_id: bulkMember, section: val("section"), title: title.trim(), link: rest.join("|").trim(), time: val("time"),
          days, start_date: val("start_date") || today(), active: true, sort: base + i, created_by: ME.id, ...inp };
      });
      const saved = await api.insertTasks(arr); S.tasks.push(...saved); sortAll(); closeForms(); toast(`${saved.length} task ditambah`);
    }
    render();
  } catch (err) { toast(errMsg(err), 1); }
});

// =====================================================================
//  AKAUN: log masuk, daftar, lupa & tetap semula kata laluan
//  (semua guna Supabase Auth; kata laluan TIDAK disimpan oleh website ini)
// =====================================================================
const isRateLimit = e => e?.status === 429 || /rate limit|too many/i.test(e?.message || "") || /over_.*rate_limit/.test(e?.code || "");
const isEmailSendErr = e => /email_address_not_authorized|sending|smtp/i.test((e?.code || "") + " " + (e?.message || ""));
const RATE_MSG = "Terlalu banyak permintaan dalam masa singkat. Sila tunggu beberapa minit, kemudian cuba lagi.";
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const setRecovery = () => { RECOVERY = true; try { sessionStorage.setItem("trb_recovery", "1"); } catch {} };
const clearRecovery = () => { RECOVERY = false; try { sessionStorage.removeItem("trb_recovery"); } catch {} };

function hideChrome() { $("nav").hidden = true; $("#logout").hidden = true; $("#who").innerHTML = ""; }
function authView(mode, note) {
  hideChrome();
  const n = note ? `<div class="note ${note.bad ? "bad" : note.info ? "info" : ""}">${note.html}</div>` : "";
  const forms = {
    login: `<form class="card form login" id="loginForm"><h2>Log masuk</h2>${n}
      <label>Email<input type="email" name="email" required autocomplete="email"></label>
      <label>Kata laluan<input type="password" name="pw" required autocomplete="current-password"></label>
      <div class="btns"><button type="submit">Masuk</button><button type="button" class="ghost" data-act="auth" data-mode="register">Daftar Akaun</button></div>
      <div class="authfoot"><button type="button" class="linkbtn" data-act="auth" data-mode="forgot">Lupa Kata Laluan?</button></div></form>`,
    register: `<form class="card form login" id="registerForm"><h2>Daftar Akaun</h2>${n}
      <p class="mute" style="margin:0">Akaun baharu perlu diluluskan oleh Owner/Admin sebelum boleh digunakan.</p>
      <label>Nama penuh<input name="name" required minlength="2" maxlength="120" autocomplete="name"></label>
      <label>Email (Gmail atau email kerja)<input type="email" name="email" required autocomplete="email"></label>
      <label>Kata laluan (minimum 8 aksara)<input type="password" name="pw" required minlength="8" autocomplete="new-password"></label>
      <label>Sahkan kata laluan<input type="password" name="pw2" required minlength="8" autocomplete="new-password"></label>
      <div class="btns"><button type="submit">Daftar</button><button type="button" class="ghost" data-act="auth" data-mode="login">Kembali ke log masuk</button></div></form>`,
    forgot: `<form class="card form login" id="forgotForm"><h2>Lupa Kata Laluan</h2>${n}
      <p class="mute" style="margin:0">Masukkan email akaun anda. Kami akan hantar link untuk tetapkan kata laluan baharu.</p>
      <label>Email<input type="email" name="email" required autocomplete="email"></label>
      <div class="btns"><button type="submit">Hantar Link Reset Password</button><button type="button" class="ghost" data-act="auth" data-mode="login">Kembali</button></div></form>`,
    reset: `<form class="card form login" id="resetForm"><h2>Tetapkan Kata Laluan Baharu</h2>${n}
      <label>Kata laluan baharu (minimum 8 aksara)<input type="password" name="pw" required minlength="8" autocomplete="new-password"></label>
      <label>Sahkan kata laluan baharu<input type="password" name="pw2" required minlength="8" autocomplete="new-password"></label>
      <div class="btns"><button type="submit">Simpan Kata Laluan</button><button type="button" class="ghost" data-act="cancelreset">Batal</button></div></form>`,
    info: `<div class="card form login">${n}<div class="btns"><button type="button" data-act="auth" data-mode="login">Ke halaman log masuk</button></div></div>`,
  };
  $("#app").innerHTML = forms[mode] || forms.login;
}

function statusView(p) {
  hideChrome(); $("#logout").hidden = false;
  const msg = {
    pending: `<h2>⏳ Menunggu kelulusan</h2><div class="note info">Pendaftaran anda berjaya. Sila tunggu kelulusan admin.<br>Anda akan dapat akses selepas Owner/Admin meluluskan akaun ini.</div>`,
    rejected: `<h2>Permohonan ditolak</h2><div class="note bad">Permohonan akaun anda tidak diluluskan. Hubungi admin jika ini satu kesilapan.</div>`,
    suspended: `<h2>Akaun digantung</h2><div class="note bad">Akaun anda telah digantung dan tidak boleh mengakses sistem buat masa ini. Hubungi admin.</div>`,
  }[p.status] || `<h2>Akaun belum aktif</h2><div class="note bad">Profil akaun tidak dijumpai. Hubungi admin.</div>`;
  $("#app").innerHTML = `<div class="card form login">${msg}
    <p class="mute" style="margin:0">Log masuk sebagai <b>${esc(p.email || "")}</b></p>
    <label>User ID anda (untuk rujukan admin)<span class="uid">${esc(p.id)}</span></label>
    <div class="btns"><button type="button" data-act="recheck">Semak semula</button><button type="button" class="ghost" data-act="logout">Log keluar</button></div></div>`;
}

async function enter(user) {
  let p;
  try { p = await api.myProfile(user.id); }
  catch (e) { return authView("login", { bad: 1, html: "Gagal membaca profil akaun: " + esc(e.message) }); }
  if (!p || p.status !== "approved") return statusView(p || { id: user.id, email: user.email, status: "missing" });
  ME = p;
  $("nav").hidden = false; $("#logout").hidden = DEMO;
  $("#who").innerHTML = `${esc(ME.full_name)} <span class="rb ${ME.role}">${ROLE_LABEL[ME.role]}</span>`;
  return start();
}

async function authSubmit(id, val, fd, form) {
  const btn = form.querySelector('button[type="submit"]'); if (btn) btn.disabled = true;
  try {
    if (id === "loginForm") {
      const email = val("email");
      const { data, error } = await sb.auth.signInWithPassword({ email, password: fd.get("pw") });
      if (error) {
        if (/not confirmed/i.test(error.message) || error.code === "email_not_confirmed")
          return authView("login", { bad: 1, html: `Email anda belum disahkan. Sila klik link dalam email pengesahan (semak folder Spam).<br><button type="button" class="linkbtn" data-act="resend" data-email="${esc(email)}">Hantar semula email pengesahan</button>` });
        if (isRateLimit(error)) return authView("login", { bad: 1, html: RATE_MSG });
        return authView("login", { bad: 1, html: "Email atau kata laluan salah." });
      }
      return enter(data.user);
    }
    if (id === "registerForm") {
      const name = val("name"), email = val("email"), pw = fd.get("pw"), pw2 = fd.get("pw2");
      if (name.length < 2) return authView("register", { bad: 1, html: "Sila masukkan nama penuh." });
      if (!EMAIL_RE.test(email)) return authView("register", { bad: 1, html: "Format email tidak sah." });
      if (pw.length < 8) return authView("register", { bad: 1, html: "Kata laluan mesti sekurang-kurangnya 8 aksara." });
      if (pw !== pw2) return authView("register", { bad: 1, html: "Kata laluan dan pengesahan kata laluan tidak sama." });
      // NOTA: hanya nama dihantar. Role & status ditetapkan oleh database (staff + pending), bukan browser.
      const { data, error } = await sb.auth.signUp({ email, password: pw, options: { data: { full_name: name }, emailRedirectTo: SITE_URL } });
      if (error) {
        if (isRateLimit(error)) return authView("register", { bad: 1, html: RATE_MSG });
        if (/weak|password/i.test(error.code || "") && !/already/i.test(error.message))
          return authView("register", { bad: 1, html: "Kata laluan terlalu lemah. Guna gabungan huruf besar, huruf kecil dan nombor." });
        if (isEmailSendErr(error))
          return authView("register", { bad: 1, html: "Sistem email belum disediakan sepenuhnya, jadi email pengesahan tidak dapat dihantar. Sila hubungi admin." });
        if (!/already|registered|exists/i.test(error.message))
          return authView("register", { bad: 1, html: "Pendaftaran gagal: " + esc(error.message) });
        // email dah wujud → paparkan mesej sama (tidak dedahkan email berdaftar)
      }
      if (data?.session) await sb.auth.signOut();
      const needVerify = !data?.session;
      return authView("info", { html: needVerify
        ? `<b>Pendaftaran berjaya.</b> Sila tunggu kelulusan admin.<br><br>📧 Langkah seterusnya: buka email <b>${esc(email)}</b> dan klik link pengesahan (semak juga folder Spam/Promotions). Selepas itu, admin akan meluluskan akaun anda.`
        : `<b>Pendaftaran berjaya.</b> Sila tunggu kelulusan admin.<br>Anda boleh log masuk untuk menyemak status akaun.` });
    }
    if (id === "forgotForm") {
      const email = val("email");
      if (!EMAIL_RE.test(email)) return authView("forgot", { bad: 1, html: "Format email tidak sah." });
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: SITE_URL });
      if (error && isRateLimit(error)) return authView("forgot", { bad: 1, html: RATE_MSG });
      // Mesej yang SAMA sama ada email wujud atau tidak
      return authView("info", { html: `Jika email <b>${esc(email)}</b> berdaftar dalam sistem, link untuk menetapkan kata laluan baharu telah dihantar.<br><br>Semak Inbox &amp; folder Spam. Link hanya sah untuk tempoh terhad dan sekali guna.<br>Jika tiada email dalam 10 minit, hubungi admin.` });
    }
    if (id === "resetForm") {
      const pw = fd.get("pw"), pw2 = fd.get("pw2");
      if (pw.length < 8) return authView("reset", { bad: 1, html: "Kata laluan mesti sekurang-kurangnya 8 aksara." });
      if (pw !== pw2) return authView("reset", { bad: 1, html: "Kata laluan dan pengesahan tidak sama." });
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { clearRecovery(); return authView("forgot", { bad: 1, html: "Link reset tidak sah atau sudah tamat tempoh. Sila minta link baharu." }); }
      const { error } = await sb.auth.updateUser({ password: pw });
      if (error) {
        if (error.code === "same_password") return authView("reset", { bad: 1, html: "Kata laluan baharu mesti berbeza daripada kata laluan lama." });
        if (error.code === "weak_password") return authView("reset", { bad: 1, html: "Kata laluan terlalu lemah. Guna gabungan huruf besar, huruf kecil dan nombor." });
        if (isRateLimit(error)) return authView("reset", { bad: 1, html: RATE_MSG });
        if (/session|jwt|expired|token/i.test(error.message)) { clearRecovery(); await sb.auth.signOut(); return authView("forgot", { bad: 1, html: "Sesi reset sudah tamat tempoh. Sila minta link baharu." }); }
        return authView("reset", { bad: 1, html: "Gagal menyimpan: " + esc(error.message) });
      }
      clearRecovery(); await sb.auth.signOut();
      return authView("login", { html: "✅ Kata laluan berjaya ditukar. Sila log masuk dengan kata laluan baharu." });
    }
  } catch (err) {
    authView(id === "loginForm" ? "login" : id === "registerForm" ? "register" : id === "resetForm" ? "reset" : "forgot",
      { bad: 1, html: isRateLimit(err) ? RATE_MSG : "Ralat rangkaian. Sila cuba lagi." });
  } finally { if (btn) btn.disabled = false; }
}

// ---------- mula ----------
async function start() {
  $("#app").innerHTML = `<div class="card empty">Loading…</div>`;
  try { await loadAll(); render(); }
  catch (e) { $("#app").innerHTML = `<div class="card empty">Ralat: ${esc(errMsg(e))}</div>`; }
}
async function boot() {
  if (DEMO) {
    api = demoApi(); $("#demo").hidden = false;
    window.__trbDemo = { authView, statusView, api, asRole: r => { ME.role = r; render(); } };   // mod demo sahaja   // untuk pratonton skrin akaun dalam mod demo
    return enter({ id: "demo-owner" });
  }
  // Baca parameter dari link email SEBELUM Supabase memprosesnya
  const hp = new URLSearchParams(location.hash.slice(1)), qp = new URLSearchParams(location.search);
  const linkType = hp.get("type") || qp.get("type");
  const linkErr = hp.get("error_code") || qp.get("error_code") || hp.get("error") || qp.get("error");
  try { RECOVERY = sessionStorage.getItem("trb_recovery") === "1"; } catch {}
  if (linkType === "recovery") setRecovery();

  const { createClient } = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
  sb = createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { flowType: "implicit", detectSessionInUrl: true, persistSession: true, autoRefreshToken: true } });
  api = sbApi(sb);
  let booted = false;
  sb.auth.onAuthStateChange(ev => { if (ev === "PASSWORD_RECOVERY") { setRecovery(); if (booted) authView("reset"); } });

  const { data: { session } } = await sb.auth.getSession();
  booted = true;
  if (location.hash || location.search) history.replaceState(null, "", location.pathname);   // buang token dari URL

  if (linkErr) {
    const expired = /expired|otp/i.test(linkErr) || /expired/i.test(hp.get("error_description") || "");
    const msg = expired ? "Link ini sudah tamat tempoh atau telah digunakan." : "Link ini tidak sah.";
    if (RECOVERY || linkType === "recovery") { clearRecovery(); return authView("forgot", { bad: 1, html: msg + " Sila minta link reset baharu." }); }
    return authView("login", { bad: 1, html: msg + " Sila cuba log masuk, atau minta link baharu." });
  }
  if (RECOVERY) {
    if (session) return authView("reset");   // JANGAN terus ke dashboard
    clearRecovery();
    return authView("forgot", { bad: 1, html: "Link reset tidak sah atau sudah tamat tempoh. Sila minta link baharu." });
  }
  if (!session) return authView("login");
  if (linkType === "signup") toast("Email berjaya disahkan.");
  return enter(session.user);
}
boot();
