select,input,textarea{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}

<script type="module">
// =====================================================================
//  TETAPAN — isi dengan maklumat projek Supabase abang
//  (Supabase → Project Settings → API Keys). Kalau kosong = mod demo.
//  ⚠️ Guna "Publishable key" (sb_publishable_...) atau "anon public" key.
//  ❌ JANGAN letak "secret key" / "service_role" key di sini.
// =====================================================================
const SUPABASE_URL = "https://oyvsmprmustmsirfdsqu.supabase.co"
const SUPABASE_KEY = "sb_publishable_H0oVuPmAef-Zi0ZXfyonIw_2t1UmOxi"
const SITE_URL     = "https://azeez189.github.io/trb-tracker/";  // alamat website (untuk link email)
// =====================================================================

const DEMO = !SUPABASE_URL || !SUPABASE_KEY;

// ---------- helper tarikh ----------
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const today = () => ymd(new Date());
const mondayOf = s => addDays(s, -((parse(s).getDay() + 6) % 7));
const dm = s => { const d = parse(s); return `${d.getDate()}/${d.getMonth() + 1}`; };
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const DN = ["Ahad", "Isnin", "Selasa", "Rabu", "Khamis", "Jumaat", "Sabtu"];
const DS = ["Ahd", "Isn", "Sel", "Rab", "Kha", "Jum", "Sab"];
const WEEK_ORDER = [1, 2, 3, 4, 5, 6, 0];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now());
const $ = s => document.querySelector(s);
const safeUrl = u => (/^https?:\/\//i.test(u) ? u : "https://" + u);

// ---------- data layer: Supabase ----------
function sbApi(sb) {
  const ok = ({ data, error }) => { if (error) throw error; return data; };
  const save = async (tb, o) => {
    const { id, created_at, ...r } = o;
    return ok(id ? await sb.from(tb).update(r).eq("id", id).select().single()
                 : await sb.from(tb).insert(r).select().single());
  };
  return {
    members: async () => ok(await sb.from("members").select("*").order("name")),
    tasks: async () => ok(await sb.from("tasks").select("*").order("sort").order("created_at")),
    checks: async (f, t) => {
      let out = [];
      for (let i = 0; ; i += 1000) {
        const d = ok(await sb.from("checks").select("task_id,date,done_by,done_at").gte("date", f).lte("date", t)
          .order("date").order("task_id").range(i, i + 999));
        out = out.concat(d);
        if (d.length < 1000) return out;
      }
    },
    saveMember: m => save("members", m),
    delMember: async id => ok(await sb.from("members").delete().eq("id", id)),
    saveTask: t => save("tasks", t),
    insertTasks: async arr => ok(await sb.from("tasks").insert(arr).select()),
    delTask: async id => ok(await sb.from("tasks").delete().eq("id", id)),
    setCheck: async (task_id, date, on) => ok(on
      ? await sb.from("checks").upsert({ task_id, date }, { onConflict: "task_id,date", ignoreDuplicates: true })
      : await sb.from("checks").delete().eq("task_id", task_id).eq("date", date)),
    // --- akaun & pengguna (semua disemak di server oleh RLS / fungsi SQL) ---
    myProfile: async uid => ok(await sb.from("profiles").select("*").eq("id", uid).maybeSingle()),
    people: async () => ok(await sb.rpc("people")),
    users: async () => ok(await sb.from("profiles").select("*").order("created_at", { ascending: false })),
    setStatus: async (id, s) => ok(await sb.rpc("set_user_status", { p_target: id, p_status: s })),
    setRole: async (id, r) => ok(await sb.rpc("set_user_role", { p_target: id, p_role: r })),
    linkMember: async (id, m) => ok(await sb.rpc("link_user_member", { p_target: id, p_member: m || null })),
    createMemberFor: async id => ok(await sb.rpc("create_member_for_user", { p_target: id })),
  };
}

// ---------- data layer: demo (dalam memori) ----------
function demoApi() {
  const st = seed();
  const upsert = (arr, o) => {
    if (o.id) { const x = arr.find(y => y.id === o.id); Object.assign(x, o); return { ...x }; }
    const n = { ...o, id: uid(), created_at: new Date().toISOString() }; arr.push(n); return { ...n };
  };
  return {
    members: async () => st.members.map(x => ({ ...x })),
    tasks: async () => st.tasks.map(x => ({ ...x })),
    checks: async (f, t) => [...st.checks].map(k => { const [task_id, date] = k.split("|"); return { task_id, date, ...st.info.get(k) }; })
      .filter(r => r.date >= f && r.date <= t),
    saveMember: async m => upsert(st.members, m),
    delMember: async id => { st.members = st.members.filter(x => x.id !== id); st.tasks = st.tasks.filter(t => t.member_id !== id); },
    saveTask: async t => upsert(st.tasks, t),
    insertTasks: async arr => arr.map(t => upsert(st.tasks, t)),
    delTask: async id => { st.tasks = st.tasks.filter(x => x.id !== id); },
    setCheck: async (task, date, on) => {
      const k = task + "|" + date;
      if (on) { st.checks.add(k); st.info.set(k, { done_by: ME.id, done_at: new Date().toISOString() }); } else { st.checks.delete(k); st.info.delete(k); }
    },
    myProfile: async () => ({ ...st.users[0] }),
    people: async () => st.users.map(u => ({ id: u.id, full_name: u.full_name })),
    users: async () => st.users.map(u => ({ ...u })),
    setStatus: async (id, s) => { const u = st.users.find(x => x.id === id); u.status = s; if (s === "approved") u.approved_at = new Date().toISOString(); },
    setRole: async (id, r) => { st.users.find(x => x.id === id).role = r; },
    linkMember: async (id, m) => {
      if (m && st.users.some(x => x.member_id === m && x.id !== id)) throw new Error("Member ini sudah dihubungkan dengan akaun lain");
      st.users.find(x => x.id === id).member_id = m || null;
    },
    createMemberFor: async id => {
      const u = st.users.find(x => x.id === id);
      const m = upsert(st.members, { name: u.full_name, role: "", start_date: today(), end_date: null, active: true });
      u.member_id = m.id; return m.id;
    },
  };
}

function seed() {

  const T = today();
  const m1 = { id: uid(), name: "Muhammad Haziq Hakimi", role: "Admin Page & Content", start_date: addDays(T, -62), end_date: addDays(T, 50), active: true };

  ["Cinta Suami Isteri", "Hamil Dalam 3 Bulan", "Kelab Soal Jawab Ibu & Bakal Ibu Comel", "Kelab Ikhtiar Hamil", "Cerita Cinta Halal",
   "Kelab Wanita Ibu Isteri Malaysia", "Dapur Simple Viral", "Bahagia Itu Kita", "Cerita Dalam Rumah", "Cinta Sampai Syurga"]
    .forEach(t => add(m1, "Posting Page 1:00 PM", t, { time: "1:00 PM" }));
  ["Cinta Suami Isteri", "Rumahtangga Bahagia Selamanya", "Hamil Dalam 3 Bulan", "Cahaya Mata", "Suami Isteri Wanita Ibu Bahagia",
   "Saya Sayang Suami Saya", "Resepi Viral", "Baby Comel", "Dapur Santai", "Realiti Kehidupan", "Pejuang 2 Garis", "Pelukan Si Kecil"]
    .forEach(t => add(m1, "Story Khind JR BP10", t));
  ["Cerita Cinta Halal", "Kelab Soal Jawab Ibu & Bakal Ibu Comel", "Kelab Wanita Ibu Isteri Malaysia"]
    .forEach(t => add(m1, "Komen Affiliate", t));
  add(m1, "Gula Melaka", "20 Affiliate TRB Gula Melaka", { days: [1, 4, 6] });
  add(m1, "Video Resepi", "Dapur Simple Viral (video resepi)", { time: "11:30 AM" });
  ["trbmarketing", "melakafoodiee", "ceoofbajet", "rimbabydking", "bosskj88"]
    .forEach(u => add(m1, "TikTok Komen", "@" + u, { link: "https://www.tiktok.com/@" + u, days: [1, 3, 5] }));
  add(m2, "Livestream", "Live sesi pagi (2 jam)", { time: "10:00 AM" });

  const stale = new Set([tasks[15].id, tasks[31].id, tasks[37].id]);
  const iso = (dd, h) => new Date(parse(dd).getTime() + h * 36e5).toISOString();
  const users = [
    { id: "demo-owner", full_name: "Abang Azeez", email: "abdulazeez5510@gmail.com", role: "owner", status: "approved", member_id: null, created_at: iso(addDays(T, -70), 9) },
    { id: "u-haziq", full_name: "Muhammad Haziq Hakimi", email: "haziq@gmail.com", role: "staff", status: "approved", member_id: m1.id, created_at: iso(addDays(T, -60), 10) },
    { id: "u-ain", full_name: "Ain", email: "ain.live@gmail.com", role: "editor", status: "approved", member_id: m2.id, created_at: iso(addDays(T, -44), 11) },

  }
  return { members: all.sort((a, b) => a.name.localeCompare(b.name)), tasks, checks, info, users };
}

// ---------- state ----------
let api, sb = null;
let ME = null;            // profile akaun yang login: {id, full_name, email, role, status, member_id}
let RECOVERY = false;     // true bila user buka link reset password
const S = { members: [], tasks: [], done: new Set(), info: new Map(), people: new Map(), users: [], ufilter: "pending",
  range: null, tab: "today", member: "", date: today(),
  week: mondayOf(today()), stale: 3, editTask: null, editMember: null, bulk: false, manageMember: null };

// ---------- kebenaran (paparan sahaja; penguatkuasaan sebenar di Supabase RLS) ----------
const ROLE_LABEL = { owner: "Owner", admin: "Admin", editor: "Editor", staff: "Staff" };
const STATUS_LABEL = { pending: "Pending", approved: "Approved", rejected: "Rejected", suspended: "Suspended" };
const can = {
  manage: () => ["owner", "admin", "editor"].includes(ME?.role),
  users: () => ["owner", "admin"].includes(ME?.role),
  delMember: () => ["owner", "admin"].includes(ME?.role),
};
const canActOn = u => !!ME && u.id !== ME.id &&
  (ME.role === "owner" ? u.role !== "owner" : ME.role === "admin" ? ["staff", "editor"].includes(u.role) : false);
const roleOptions = () => ME.role === "owner" ? ["admin", "editor", "staff"] : ["editor", "staff"];
const errMsg = e => (e?.code === "42501" || /row-level security|permission denied/i.test(e?.message || ""))
  ? "Tiada kebenaran untuk tindakan ini." : (e?.message || String(e));

async function ensure(f, t) {
  if (S.range && f >= S.range[0] && t <= S.range[1]) return;
  if (S.range) { if (S.range[0] < f) f = S.range[0]; if (S.range[1] > t) t = S.range[1]; }
  const rows = await api.checks(f, t);
  S.done = new Set(rows.map(r => r.task_id + "|" + r.date));
  S.info = new Map(rows.map(r => [r.task_id + "|" + r.date, { by: r.done_by, at: r.done_at }]));
  S.range = [f, t];
}
async function loadAll() {
  [S.members, S.tasks] = await Promise.all([api.members(), api.tasks()]);
  sortAll();
  S.range = null;
  await ensure(addDays(today(), -120), addDays(today(), 7));
  try { S.people = new Map((await api.people()).map(p => [p.id, p.full_name])); } catch { S.people = new Map(); }
  if (!can.manage()) S.member = ME.member_id || "";
  else if (!S.member || !S.members.some(m => m.id === S.member)) S.member = S.members.find(m => m.active)?.id || "";
}
const whoTxt = (t, d) => {
  const i = S.info.get(t.id + "|" + d); if (!i) return "";
  const nm = i.by ? (i.by === ME?.id ? "Anda" : S.people.get(i.by) || "Pengguna lain") : "—";
  const at = i.at ? new Date(i.at) : null;
  return `${nm}${at ? ` · ${at.getDate()}/${at.getMonth() + 1} ${pad(at.getHours())}:${pad(at.getMinutes())}` : ""}`;
};
const sortAll = () => {
  S.members.sort((a, b) => a.name.localeCompare(b.name));
  S.tasks.sort((a, b) => (a.sort ?? 0) - (b.sort ?? 0));
};
const upd = (arr, o) => { const i = arr.findIndex(x => x.id === o.id); i < 0 ? arr.push(o) : (arr[i] = o); };
const nextSort = () => S.tasks.reduce((mx, t) => Math.max(mx, t.sort ?? 0), 0) + 1;

// ---------- logik ----------
const memberOf = t => S.members.find(m => m.id === t.member_id);
const isDone = (t, d) => S.done.has(t.id + "|" + d);
function scheduled(t, d) {
  if (!t.active) return false;
  if (t.start_date && d < t.start_date) return false;
  const m = memberOf(t);
  if (!m || !m.active) return false;
  if (m.start_date && d < m.start_date) return false;
  if (m.end_date && d > m.end_date) return false;
  return (t.days || []).includes(parse(d).getDay());
}
const tasksFor = mid => S.tasks.filter(t => (!mid || t.member_id === mid) && memberOf(t));
function grouped(list) {
  const out = [];
  for (const m of S.members) {
    const ts = list.filter(t => t.member_id === m.id);
    if (!ts.length) continue;
    const secs = [];
    for (const t of ts) { let s = secs.find(x => x.name === t.section); if (!s) secs.push(s = { name: t.section, tasks: [] }); s.tasks.push(t); }
    out.push({ m, secs });
  }
  return out;
}
function stats(mid, ws) {
  const T = today(); let sch = 0, done = 0, miss = 0, pend = 0; const missed = [];
  for (let i = 0; i < 7; i++) {
    const d = addDays(ws, i);
    for (const t of S.tasks) {
      if (t.member_id !== mid || !scheduled(t, d)) continue;
      sch++;
      if (isDone(t, d)) done++;
      else if (d < T) { miss++; missed.push([t, d]); }
      else pend++;
    }
  }
  const due = done + miss;
  return { sch, done, miss, pend, missed, pct: due ? Math.round(done * 100 / due) : null };
}
function staleList() {
  const T = today(), out = [];
  for (const t of S.tasks) {
    const m = memberOf(t);
    if (!m || !m.active || !t.active || isDone(t, T)) continue;
    let last = null, missed = 0;
    for (let i = 1; i <= 120; i++) {
      const d = addDays(T, -i);
      if (isDone(t, d)) { last = d; break; }
      if (scheduled(t, d)) missed++;
    }
    if (missed >= S.stale) out.push({ t, m, last, missed, ago: last ? daysBetween(last, T) : null });
  }
  return out.sort((a, b) => b.missed - a.missed);
}
const daysTxt = ds => {
  const s = [...ds].sort();
  if (s.length === 7) return "Setiap hari";
  if (s.join() === "1,2,3,4,5,6") return "Isnin–Sabtu";
  if (s.join() === "1,2,3,4,5") return "Isnin–Jumaat";
  return WEEK_ORDER.filter(d => ds.includes(d)).map(d => DS[d]).join(", ");
};

    const trend = [3, 2, 1].map(k => stats(m.id, addDays(S.week, -7 * k)).pct);
    const cls = s.pct == null ? "" : s.pct >= 90 ? "good" : s.pct >= 70 ? "mid" : "low";

      : `<span class="rb ${u.role}">${ROLE_LABEL[u.role]}</span>`;
    const canLink = act || self;
    const mName = u.member_id ? (S.members.find(m => m.id === u.member_id)?.name || "(member dipadam)") : "";
    const memberCell = canLink
      ? `<select data-link-for="${u.id}"><option value="">— Tiada —</option>${S.members.filter(m => !linked.has(m.id) || linked.get(m.id) === u.id)
          .map(m => `<option value="${m.id}" ${m.id === u.member_id ? "selected" : ""}>${esc(m.name)}</option>`).join("")}</select>
         ${u.member_id ? "" : `<button class="ghost sm" data-act="mkmember" data-u="${u.id}" title="Cipta rekod member baharu guna nama akaun ini">+ Cipta</button>`}`
      : esc(mName) || `<span class="mute">—</span>`;
    let btns = "";
    if (act) {
      if (u.status === "pending") btns = `<button class="sm" data-act="ustatus" data-u="${u.id}" data-s="approved">Approve</button> <button class="ghost sm danger" data-act="ustatus" data-u="${u.id}" data-s="rejected">Reject</button>`;
      else if (u.status === "approved") btns = `<button class="ghost sm danger" data-act="ustatus" data-u="${u.id}" data-s="suspended">Suspend</button>`;
      else if (u.status === "rejected") btns = `<button class="sm" data-act="ustatus" data-u="${u.id}" data-s="approved">Approve</button>`;
      else if (u.status === "suspended") btns = `<button class="sm" data-act="ustatus" data-u="${u.id}" data-s="approved">Aktifkan semula</button>`;
    } else btns = `<span class="mute">${self ? "Akaun anda" : u.role === "owner" ? "Dilindungi" : "Tiada kebenaran"}</span>`;
    h += `<tr><td><b>${esc(u.full_name)}</b></td><td>${esc(u.email)}</td><td>${d.getDate()}/${d.getMonth() + 1}/${d.getFullYear()}</td>
      <td><span class="rb ${u.status}">${STATUS_LABEL[u.status]}</span></td><td>${roleCell}</td><td>${memberCell}</td><td style="white-space:nowrap">${btns}</td></tr>`;
  }
  return h + `</tbody></table></div>`;
}

// ---------- render ----------
const TAB_OK = { today: () => true, week: () => true, summary: () => true, manage: () => can.manage(), users: () => can.users() };
function render() {
  if (!TAB_OK[S.tab]()) S.tab = "today";
  document.querySelectorAll("nav button").forEach(b => { b.classList.toggle("on", b.dataset.tab === S.tab); b.hidden = !TAB_OK[b.dataset.tab](); });
  const v = { today: vToday, week: vWeek, summary: vSummary, manage: vManage, users: vUsers }[S.tab];
  if (!can.manage() && !ME.member_id && S.tab !== "users")
    return ($("#app").innerHTML = `<div class="card empty">Akaun anda dah diluluskan, tapi belum dihubungkan dengan rekod <b>Member</b>.<br>Minta Owner/Admin hubungkan akaun anda di tab Pengurusan Pengguna.</div>`);
  $("#app").innerHTML = (S.members.length || S.tab === "manage" || S.tab === "users") ? v()
    : `<div class="card empty">Belum ada member. Pergi tab <b>⚙️ Urus Team &amp; Task</b> untuk mula.</div>`;
}
function toast(msg, bad) {
  const t = $("#toast"); t.textContent = msg; t.className = "show" + (bad ? " bad" : "");
  clearTimeout(toast.h); toast.h = setTimeout(() => (t.className = ""), 2600);
}
async function toggle(tid, d, on) {
  const k = tid + "|" + d;
  const prev = S.info.get(k);
  if (on) { S.done.add(k); S.info.set(k, { by: ME.id, at: new Date().toISOString() }); } else { S.done.delete(k); S.info.delete(k); }
  render();
  try { await api.setCheck(tid, d, on); }
  catch (e) {
    if (on) { S.done.delete(k); S.info.delete(k); } else { S.done.add(k); if (prev) S.info.set(k, prev); }
    render(); toast("Gagal simpan: " + errMsg(e), 1);
  }
}
const closeForms = () => { S.editTask = null; S.editMember = null; S.bulk = false; };

// ---------- events ----------
async function reloadUsers() {
  [S.users, S.members] = await Promise.all([api.users(), api.members()]); sortAll();
  const mine = S.users.find(u => u.id === ME.id); if (mine) ME.member_id = mine.member_id;
}
document.addEventListener("click", async e => {
  const tab = e.target.closest("[data-tab]");
  if (tab) {
    S.tab = tab.dataset.tab; closeForms();
    if (S.tab === "users" && can.users()) { $("#app").innerHTML = `<div class="card empty">Loading…</div>`; try { await reloadUsers(); } catch (err) { toast(errMsg(err), 1); } }
    return render();
  }
  const cell = e.target.closest("td.cell");
  if (cell) return toggle(cell.dataset.t, cell.dataset.d, !S.done.has(cell.dataset.t + "|" + cell.dataset.d));
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, n = +b.dataset.n;
  // --- skrin log masuk / daftar / lupa kata laluan ---
  if (a === "auth") { e.preventDefault(); return authView(b.dataset.mode); }
  if (a === "logout" || a === "cancelreset") { clearRecovery(); if (sb) await sb.auth.signOut(); return location.replace(location.pathname); }
  if (a === "recheck") return location.reload();
  if (a === "resend") {
    const email = b.dataset.email;
    const { error } = await sb.auth.resend({ type: "signup", email, options: { emailRedirectTo: SITE_URL } });
    return authView("login", error && isRateLimit(error)
      ? { bad: 1, html: "Terlalu banyak permintaan email. Sila tunggu beberapa minit dan cuba lagi." }
      : { html: "Jika akaun ini wujud dan belum disahkan, email pengesahan baharu telah dihantar. Semak Inbox &amp; folder Spam." });
  }
  try {
    if (a === "day") { S.date = addDays(S.date, n); await ensure(addDays(S.date, -1), S.date); }
    else if (a === "gotoday") S.date = today();
    else if (a === "wk") { S.week = addDays(S.week, n); await ensure(addDays(S.week, -21), addDays(S.week, 6)); }
    else if (a === "thiswk") S.week = mondayOf(today());
    else if (a === "openweek") { S.member = b.dataset.m; S.tab = "week"; }
    else if (a === "newmember") { closeForms(); S.editMember = { active: true, start_date: today() }; }
    else if (a === "editmember") { closeForms(); S.editMember = { ...S.members.find(x => x.id === b.dataset.m) }; }
    else if (a === "pickm") { closeForms(); S.manageMember = b.dataset.m; }
    else if (a === "newtask") { closeForms(); S.editTask = { active: true }; }
    else if (a === "bulk") { closeForms(); S.bulk = true; }
    else if (a === "edittask") { closeForms(); S.editTask = { ...S.tasks.find(x => x.id === b.dataset.t) }; }
    else if (a === "cancel") closeForms();
    else if (a === "deltask") {
      const t = S.tasks.find(x => x.id === b.dataset.t);
      if (!confirm(`Padam task "${t.title}"? Semua rekod tanda untuk task ni pun akan hilang.`)) return;
      await api.delTask(t.id); S.tasks = S.tasks.filter(x => x.id !== t.id); toast("Task dipadam");
    }
    else if (a === "delmember") {
      const m = S.members.find(x => x.id === b.dataset.m);
      if (!confirm(`Padam ${m.name} berserta semua task & rekod? Kalau sekadar dah berhenti, lebih baik untick "Aktif".`)) return;
      await api.delMember(m.id); S.members = S.members.filter(x => x.id !== m.id); S.tasks = S.tasks.filter(t => t.member_id !== m.id);
      closeForms(); toast("Member dipadam");
    }
    // --- pengurusan pengguna ---
    else if (a === "ufilter") S.ufilter = b.dataset.s;
    else if (a === "reloadusers") { await reloadUsers(); toast("Senarai dikemas kini"); }
    else if (a === "ustatus") {
      const u = S.users.find(x => x.id === b.dataset.u), s = b.dataset.s;
      const word = { approved: "Approve", rejected: "Reject", suspended: "Suspend" }[s];
      if (s !== "approved" && !confirm(`${word} akaun ${u.full_name}? Pengguna ini tidak akan dapat mengakses sistem.`)) return;
      await api.setStatus(u.id, s); await reloadUsers(); toast(`${u.full_name}: ${STATUS_LABEL[s]}`);
    }
    else if (a === "mkmember") {
      const u = S.users.find(x => x.id === b.dataset.u);
      if (!confirm(`Cipta rekod member baharu "${u.full_name}" dan hubungkan dengan akaun ini?`)) return;
      await api.createMemberFor(u.id); await reloadUsers(); [S.tasks] = [await api.tasks()]; sortAll(); toast("Member dicipta & dihubungkan");
    }
    render();
  } catch (err) { toast(errMsg(err), 1); render(); }
});

document.addEventListener("change", async e => {
  const el = e.target;
  if (el.dataset.chk) return toggle(el.dataset.chk, el.dataset.d, el.checked);
  if (el.id === "memSel") { S.member = el.value; render(); }
  if (el.id === "dateIn" && el.value) { S.date = el.value; await ensure(addDays(S.date, -1), S.date); render(); }
  if (el.id === "staleIn") { S.stale = Math.max(1, +el.value || 1); render(); }
  try {
    if (el.dataset.roleFor) {
      const u = S.users.find(x => x.id === el.dataset.roleFor);
      if (!confirm(`Tukar role ${u.full_name} kepada ${ROLE_LABEL[el.value]}?`)) return render();
      await api.setRole(u.id, el.value); await reloadUsers(); toast("Role dikemas kini"); render();
    }
    if (el.dataset.linkFor) {
      await api.linkMember(el.dataset.linkFor, el.value || null); await reloadUsers(); toast(el.value ? "Akaun dihubungkan dengan member" : "Hubungan dibuang"); render();
    }
  } catch (err) { toast(errMsg(err), 1); render(); }
});

document.addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target, fd = new FormData(f), days = fd.getAll("days").map(Number);
  const val = k => (fd.get(k) || "").toString().trim();
  if (["loginForm", "registerForm", "forgotForm", "resetForm"].includes(f.id)) return authSubmit(f.id, val, fd, f);
  try {
    if (f.id === "memberForm") {
      const m = { ...S.editMember, name: val("name"), role: val("role"), start_date: val("start_date") || null, end_date: val("end_date") || null, active: fd.has("active") };
      const saved = await api.saveMember(m); upd(S.members, saved); sortAll();
      S.manageMember = saved.id; if (!S.member) S.member = saved.id; closeForms(); toast("Member disimpan");
    }
    else if (f.id === "taskForm") {
      if (!days.length) return toast("Pilih sekurang-kurangnya satu hari", 1);
      const t = { ...S.editTask, member_id: S.editTask.member_id || S.manageMember, section: val("section"), title: val("title"),
        link: val("link"), time: val("time"), days, start_date: val("start_date") || today(), active: fd.has("active") };
      if (!t.id) t.sort = nextSort();
      const saved = await api.saveTask(t); upd(S.tasks, saved); sortAll(); closeForms(); toast("Task disimpan");
    }
    else if (f.id === "bulkForm") {
      if (!days.length) return toast("Pilih sekurang-kurangnya satu hari", 1);
      const base = nextSort();
      const arr = val("lines").split("\n").map(l => l.trim()).filter(Boolean).map((l, i) => {
        const [title, ...rest] = l.split("|");
        return { member_id: S.manageMember, section: val("section"), title: title.trim(), link: rest.join("|").trim(), time: val("time"),
          days, start_date: val("start_date") || today(), active: true, sort: base + i };
      });
      const saved = await api.insertTasks(arr); S.tasks.push(...saved); sortAll(); closeForms(); toast(`${saved.length} task ditambah`);
    }
    render();
  } catch (err) { toast(errMsg(err), 1); }
});

// =====================================================================
//  AKAUN: log masuk, daftar, lupa & tetap semula kata laluan
//  (semua guna Supabase Auth; kata laluan TIDAK disimpan oleh website ini)
// =====================================================================
const isRateLimit = e => e?.status === 429 || /rate limit|too many/i.test(e?.message || "") || /over_.*rate_limit/.test(e?.code || "");
const isEmailSendErr = e => /email_address_not_authorized|sending|smtp/i.test((e?.code || "") + " " + (e?.message || ""));
const RATE_MSG = "Terlalu banyak permintaan dalam masa singkat. Sila tunggu beberapa minit, kemudian cuba lagi.";
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const setRecovery = () => { RECOVERY = true; try { sessionStorage.setItem("trb_recovery", "1"); } catch {} };
const clearRecovery = () => { RECOVERY = false; try { sessionStorage.removeItem("trb_recovery"); } catch {} };

function hideChrome() { $("nav").hidden = true; $("#logout").hidden = true; $("#who").innerHTML = ""; }
function authView(mode, note) {
  hideChrome();
  const n = note ? `<div class="note ${note.bad ? "bad" : note.info ? "info" : ""}">${note.html}</div>` : "";
  const forms = {
    login: `<form class="card form login" id="loginForm"><h2>Log masuk</h2>${n}
      <label>Email<input type="email" name="email" required autocomplete="email"></label>
      <label>Kata laluan<input type="password" name="pw" required autocomplete="current-password"></label>
      <div class="btns"><button type="submit">Masuk</button><button type="button" class="ghost" data-act="auth" data-mode="register">Daftar Akaun</button></div>
      <div class="authfoot"><button type="button" class="linkbtn" data-act="auth" data-mode="forgot">Lupa Kata Laluan?</button></div></form>`,
    register: `<form class="card form login" id="registerForm"><h2>Daftar Akaun</h2>${n}
      <p class="mute" style="margin:0">Akaun baharu perlu diluluskan oleh Owner/Admin sebelum boleh digunakan.</p>
      <label>Nama penuh<input name="name" required minlength="2" maxlength="120" autocomplete="name"></label>
      <label>Email (Gmail atau email kerja)<input type="email" name="email" required autocomplete="email"></label>
      <label>Kata laluan (minimum 8 aksara)<input type="password" name="pw" required minlength="8" autocomplete="new-password"></label>
      <label>Sahkan kata laluan<input type="password" name="pw2" required minlength="8" autocomplete="new-password"></label>
      <div class="btns"><button type="submit">Daftar</button><button type="button" class="ghost" data-act="auth" data-mode="login">Kembali ke log masuk</button></div></form>`,
    forgot: `<form class="card form login" id="forgotForm"><h2>Lupa Kata Laluan</h2>${n}
      <p class="mute" style="margin:0">Masukkan email akaun anda. Kami akan hantar link untuk tetapkan kata laluan baharu.</p>
      <label>Email<input type="email" name="email" required autocomplete="email"></label>
      <div class="btns"><button type="submit">Hantar Link Reset Password</button><button type="button" class="ghost" data-act="auth" data-mode="login">Kembali</button></div></form>`,
    reset: `<form class="card form login" id="resetForm"><h2>Tetapkan Kata Laluan Baharu</h2>${n}
      <label>Kata laluan baharu (minimum 8 aksara)<input type="password" name="pw" required minlength="8" autocomplete="new-password"></label>
      <label>Sahkan kata laluan baharu<input type="password" name="pw2" required minlength="8" autocomplete="new-password"></label>
      <div class="btns"><button type="submit">Simpan Kata Laluan</button><button type="button" class="ghost" data-act="cancelreset">Batal</button></div></form>`,
    info: `<div class="card form login">${n}<div class="btns"><button type="button" data-act="auth" data-mode="login">Ke halaman log masuk</button></div></div>`,
  };
  $("#app").innerHTML = forms[mode] || forms.login;
}

function statusView(p) {
  hideChrome(); $("#logout").hidden = false;
  const msg = {
    pending: `<h2>⏳ Menunggu kelulusan</h2><div class="note info">Pendaftaran anda berjaya. Sila tunggu kelulusan admin.<br>Anda akan dapat akses selepas Owner/Admin meluluskan akaun ini.</div>`,
    rejected: `<h2>Permohonan ditolak</h2><div class="note bad">Permohonan akaun anda tidak diluluskan. Hubungi admin jika ini satu kesilapan.</div>`,
    suspended: `<h2>Akaun digantung</h2><div class="note bad">Akaun anda telah digantung dan tidak boleh mengakses sistem buat masa ini. Hubungi admin.</div>`,
  }[p.status] || `<h2>Akaun belum aktif</h2><div class="note bad">Profil akaun tidak dijumpai. Hubungi admin.</div>`;
  $("#app").innerHTML = `<div class="card form login">${msg}
    <p class="mute" style="margin:0">Log masuk sebagai <b>${esc(p.email || "")}</b></p>
    <label>User ID anda (untuk rujukan admin)<span class="uid">${esc(p.id)}</span></label>
    <div class="btns"><button type="button" data-act="recheck">Semak semula</button><button type="button" class="ghost" data-act="logout">Log keluar</button></div></div>`;
}

async function enter(user) {
  let p;
  try { p = await api.myProfile(user.id); }
  catch (e) { return authView("login", { bad: 1, html: "Gagal membaca profil akaun: " + esc(e.message) }); }
  if (!p || p.status !== "approved") return statusView(p || { id: user.id, email: user.email, status: "missing" });
  ME = p;
  $("nav").hidden = false; $("#logout").hidden = DEMO;
  $("#who").innerHTML = `${esc(ME.full_name)} <span class="rb ${ME.role}">${ROLE_LABEL[ME.role]}</span>`;
  return start();
}

async function authSubmit(id, val, fd, form) {
  const btn = form.querySelector('button[type="submit"]'); if (btn) btn.disabled = true;
  try {
    if (id === "loginForm") {
      const email = val("email");
      const { data, error } = await sb.auth.signInWithPassword({ email, password: fd.get("pw") });
      if (error) {
        if (/not confirmed/i.test(error.message) || error.code === "email_not_confirmed")
          return authView("login", { bad: 1, html: `Email anda belum disahkan. Sila klik link dalam email pengesahan (semak folder Spam).<br><button type="button" class="linkbtn" data-act="resend" data-email="${esc(email)}">Hantar semula email pengesahan</button>` });
        if (isRateLimit(error)) return authView("login", { bad: 1, html: RATE_MSG });
        return authView("login", { bad: 1, html: "Email atau kata laluan salah." });
      }
      return enter(data.user);
    }
    if (id === "registerForm") {
      const name = val("name"), email = val("email"), pw = fd.get("pw"), pw2 = fd.get("pw2");
      if (name.length < 2) return authView("register", { bad: 1, html: "Sila masukkan nama penuh." });
      if (!EMAIL_RE.test(email)) return authView("register", { bad: 1, html: "Format email tidak sah." });
      if (pw.length < 8) return authView("register", { bad: 1, html: "Kata laluan mesti sekurang-kurangnya 8 aksara." });
      if (pw !== pw2) return authView("register", { bad: 1, html: "Kata laluan dan pengesahan kata laluan tidak sama." });
      // NOTA: hanya nama dihantar. Role & status ditetapkan oleh database (staff + pending), bukan browser.
      const { data, error } = await sb.auth.signUp({ email, password: pw, options: { data: { full_name: name }, emailRedirectTo: SITE_URL } });
      if (error) {
        if (isRateLimit(error)) return authView("register", { bad: 1, html: RATE_MSG });
        if (/weak|password/i.test(error.code || "") && !/already/i.test(error.message))
          return authView("register", { bad: 1, html: "Kata laluan terlalu lemah. Guna gabungan huruf besar, huruf kecil dan nombor." });
        if (isEmailSendErr(error))
          return authView("register", { bad: 1, html: "Sistem email belum disediakan sepenuhnya, jadi email pengesahan tidak dapat dihantar. Sila hubungi admin." });
        if (!/already|registered|exists/i.test(error.message))
          return authView("register", { bad: 1, html: "Pendaftaran gagal: " + esc(error.message) });
        // email dah wujud → paparkan mesej sama (tidak dedahkan email berdaftar)
      }
      if (data?.session) await sb.auth.signOut();
      const needVerify = !data?.session;
      return authView("info", { html: needVerify
        ? `<b>Pendaftaran berjaya.</b> Sila tunggu kelulusan admin.<br><br>📧 Langkah seterusnya: buka email <b>${esc(email)}</b> dan klik link pengesahan (semak juga folder Spam/Promotions). Selepas itu, admin akan meluluskan akaun anda.`
        : `<b>Pendaftaran berjaya.</b> Sila tunggu kelulusan admin.<br>Anda boleh log masuk untuk menyemak status akaun.` });
    }
    if (id === "forgotForm") {
      const email = val("email");
      if (!EMAIL_RE.test(email)) return authView("forgot", { bad: 1, html: "Format email tidak sah." });
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: SITE_URL });
      if (error && isRateLimit(error)) return authView("forgot", { bad: 1, html: RATE_MSG });
      // Mesej yang SAMA sama ada email wujud atau tidak
      return authView("info", { html: `Jika email <b>${esc(email)}</b> berdaftar dalam sistem, link untuk menetapkan kata laluan baharu telah dihantar.<br><br>Semak Inbox &amp; folder Spam. Link hanya sah untuk tempoh terhad dan sekali guna.<br>Jika tiada email dalam 10 minit, hubungi admin.` });
    }
    if (id === "resetForm") {
      const pw = fd.get("pw"), pw2 = fd.get("pw2");
      if (pw.length < 8) return authView("reset", { bad: 1, html: "Kata laluan mesti sekurang-kurangnya 8 aksara." });
      if (pw !== pw2) return authView("reset", { bad: 1, html: "Kata laluan dan pengesahan tidak sama." });
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { clearRecovery(); return authView("forgot", { bad: 1, html: "Link reset tidak sah atau sudah tamat tempoh. Sila minta link baharu." }); }
      const { error } = await sb.auth.updateUser({ password: pw });
      if (error) {
        if (error.code === "same_password") return authView("reset", { bad: 1, html: "Kata laluan baharu mesti berbeza daripada kata laluan lama." });
        if (error.code === "weak_password") return authView("reset", { bad: 1, html: "Kata laluan terlalu lemah. Guna gabungan huruf besar, huruf kecil dan nombor." });
        if (isRateLimit(error)) return authView("reset", { bad: 1, html: RATE_MSG });
        if (/session|jwt|expired|token/i.test(error.message)) { clearRecovery(); await sb.auth.signOut(); return authView("forgot", { bad: 1, html: "Sesi reset sudah tamat tempoh. Sila minta link baharu." }); }
        return authView("reset", { bad: 1, html: "Gagal menyimpan: " + esc(error.message) });
      }
      clearRecovery(); await sb.auth.signOut();
      return authView("login", { html: "✅ Kata laluan berjaya ditukar. Sila log masuk dengan kata laluan baharu." });
    }
  } catch (err) {
    authView(id === "loginForm" ? "login" : id === "registerForm" ? "register" : id === "resetForm" ? "reset" : "forgot",
      { bad: 1, html: isRateLimit(err) ? RATE_MSG : "Ralat rangkaian. Sila cuba lagi." });
  } finally { if (btn) btn.disabled = false; }
}

// ---------- mula ----------
async function start() {
  $("#app").innerHTML = `<div class="card empty">Loading…</div>`;
  try { await loadAll(); render(); }
  catch (e) { $("#app").innerHTML = `<div class="card empty">Ralat: ${esc(errMsg(e))}</div>`; }
}
async function boot() {
  if (DEMO) {
    api = demoApi(); $("#demo").hidden = false;
    window.__trbDemo = { authView, statusView };   // untuk pratonton skrin akaun dalam mod demo
    return enter({ id: "demo-owner" });
  }
  // Baca parameter dari link email SEBELUM Supabase memprosesnya
  const hp = new URLSearchParams(location.hash.slice(1)), qp = new URLSearchParams(location.search);
  const linkType = hp.get("type") || qp.get("type");
  const linkErr = hp.get("error_code") || qp.get("error_code") || hp.get("error") || qp.get("error");
  try { RECOVERY = sessionStorage.getItem("trb_recovery") === "1"; } catch {}
  if (linkType === "recovery") setRecovery();

  const { createClient } = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
  sb = createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { flowType: "implicit", detectSessionInUrl: true, persistSession: true, autoRefreshToken: true } });
  api = sbApi(sb);
  let booted = false;
  sb.auth.onAuthStateChange(ev => { if (ev === "PASSWORD_RECOVERY") { setRecovery(); if (booted) authView("reset"); } });

  const { data: { session } } = await sb.auth.getSession();
  booted = true;
  if (location.hash || location.search) history.replaceState(null, "", location.pathname);   // buang token dari URL

  if (linkErr) {
    const expired = /expired|otp/i.test(linkErr) || /expired/i.test(hp.get("error_description") || "");
    const msg = expired ? "Link ini sudah tamat tempoh atau telah digunakan." : "Link ini tidak sah.";
    if (RECOVERY || linkType === "recovery") { clearRecovery(); return authView("forgot", { bad: 1, html: msg + " Sila minta link reset baharu." }); }
    return authView("login", { bad: 1, html: msg + " Sila cuba log masuk, atau minta link baharu." });
  }
  if (RECOVERY) {
    if (session) return authView("reset");   // JANGAN terus ke dashboard
    clearRecovery();
    return authView("forgot", { bad: 1, html: "Link reset tidak sah atau sudah tamat tempoh. Sila minta link baharu." });
  }
  if (!session) return authView("login");
  if (linkType === "signup") toast("Email berjaya disahkan.");
  return enter(session.user);
}
boot();
</script>
</body>
</html>
